<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты | Мила Ушакова</title>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#c9a96e;--ink:#000;--ink-mid:#111;--ink-muted:#333;--bg:#faf9f7;--bg2:#f4f1ec;--border:rgba(0,0,0,0.08);}
html{scroll-behavior:smooth;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;justify-content:space-between;align-items:center;padding:1.4rem 2.5rem;}
.nav-logo{font-family:'Tenor Sans',sans-serif;font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;}
.nav-pill{display:flex;align-items:center;gap:.1rem;background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:50px;padding:.4rem .5rem;box-shadow:0 2px 20px rgba(0,0,0,0.08);}
.nav-pill a{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);text-decoration:none;padding:.4rem .9rem;border-radius:50px;transition:all .2s;white-space:nowrap;}
.nav-pill a:hover,.nav-pill a.active{color:var(--ink);background:rgba(0,0,0,0.04);}
.nav-pill .cta{background:var(--ink);color:#fff!important;margin-left:.2rem;}
.nav-pill .cta:hover{background:var(--gold)!important;color:var(--ink)!important;}
.hero{display:grid;grid-template-columns:30fr 70fr;min-height:50vh;}
.hero-visual{background:linear-gradient(135deg,#e8dfd4 0%,#c9a96e 50%,#d4b896 100%);}
.hero-text{display:flex;flex-direction:column;justify-content:center;padding:8rem 3.5rem 4rem 3rem;}
.eyebrow{font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem;display:block;}
.hero-title{font-family:'Tenor Sans',sans-serif;font-size:clamp(2.2rem,4vw,3.8rem);line-height:1.05;margin-bottom:1.25rem;}
.hero-title em{font-style:italic;color:var(--gold);}
.contacts-wrap{display:grid;grid-template-columns:30fr 70fr;border-bottom:1px solid var(--border);}
.contacts-visual{background:var(--bg2);min-height:400px;}
.contacts-content{padding:4rem 3rem 4rem 3.5rem;display:flex;flex-direction:column;gap:2.5rem;}
.section-label{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem;display:block;}
.contact-item{display:flex;gap:1.25rem;align-items:flex-start;}
.contact-icon{font-size:1rem;color:var(--gold);flex-shrink:0;width:24px;margin-top:.1rem;font-family:'Tenor Sans',sans-serif;}
.contact-lbl{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);display:block;margin-bottom:.3rem;}
.contact-val{font-family:'Tenor Sans',sans-serif;font-size:1.3rem;color:var(--ink);text-decoration:none;display:block;}
.contact-val:hover{color:var(--gold);}
.contact-sub{font-size:.75rem;color:var(--ink-muted);margin-top:.25rem;}
footer{background:var(--bg2);padding:1.75rem 2.5rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);flex-wrap:wrap;gap:1.5rem;}
.footer-logo{font-family:'Tenor Sans',sans-serif;font-size:1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;}
.footer-links{display:flex;gap:1.5rem;list-style:none;}
.footer-links a{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);text-decoration:none;transition:color .2s;}
.footer-links a:hover{color:var(--gold);}
.footer-socials{display:flex;gap:.6rem;}
.sb{width:33px;height:33px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-muted);text-decoration:none;transition:all .2s;font-size:.72rem;}
.sb:hover{border-color:var(--gold);color:var(--gold);}
@media(max-width:900px){nav{padding:1rem 1.4rem;}.nav-pill a:not(.cta){display:none;}.hero,.contacts-wrap{grid-template-columns:1fr;}.hero-visual{min-height:40vw;}.hero-text,.contacts-content{padding:3rem 1.5rem;}.contacts-visual{min-height:180px;}footer{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">Mila Ushakova</a>
  <div class="nav-pill">
    <a href="/lectures">Подкасты</a>
    <a href="/color-guide">Гайд</a>
    <a href="/contacts" class="active">Контакты</a>
    <a href="/booking" class="cta">записаться на консультацию</a>
  </div>
</nav>
<div class="hero">
  <div class="hero-visual"></div>
  <div class="hero-text">
    
    <h1 class="hero-title">Контакты</h1>
  </div>
</div>
<div class="contacts-wrap">
  <div class="contacts-visual"></div>
  <div class="contacts-content">
    
    <div class="contact-item">
      <div class="contact-icon">✉</div>
      <div>
        <span class="contact-lbl">Email</span>
        <a href="mailto:stylefromila@gmail.com" class="contact-val">stylefromila@gmail.com</a>
      </div>
    </div>
    <div class="contact-item">
      <div class="contact-icon">IG</div>
      <div>
        <span class="contact-lbl">Instagram</span>
        <a href="https://www.instagram.com/milaushakovva/" target="_blank" class="contact-val">@milaushakovva</a>
      </div>
    </div>
    <div class="contact-item">
      <div class="contact-icon">TG</div>
      <div>
        <span class="contact-lbl">Telegram канал</span>
        <a href="https://t.me/milaushakova" target="_blank" class="contact-val">@milaushakova</a>
        <div class="contact-sub">Работаю онлайн по всему миру</div>
      </div>
    </div>
  </div>
</div>
<footer>
  <a href="/" class="footer-logo">Mila Ushakova</a>
  <ul class="footer-links">
    <li><a href="/lectures">Подкасты</a></li>
    <li><a href="/color-guide">Гайд</a></li>
    <li><a href="/contacts">Контакты</a></li>
  </ul>
  <div class="footer-socials">
    <a class="sb" href="https://www.instagram.com/milaushakovva/" target="_blank">IG</a>
    <a class="sb" href="mailto:stylefromila@gmail.com">✉</a>
  </div>
</footer>
</body>
</html>
