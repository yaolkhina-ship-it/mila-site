<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Мила Ушакова — fashion эксперт. Личные консультации, fashion туры, лекции, съёмки и эксклюзивный гайды по цветовым сочетаниям.">
<meta property="og:title" content="Мила Ушакова | Fashion Expert · Milan-Paris-Moscow">
<title>Мила Ушакова | Fashion Expert</title>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#c9a96e;--gold-light:#e4c99a;
  --ink:#111;--ink-mid:#555;--ink-muted:#999;
  --bg:#faf9f7;--bg2:#f4f1ec;
  --border:rgba(0,0,0,0.08);
}
html{scroll-behavior:smooth;}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;}

/* NAV — всегда поверх всего */
nav{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;justify-content:space-between;align-items:center;padding:1.4rem 2.5rem;pointer-events:all;}
.nav-logo{font-family:'Tenor Sans',sans-serif;font-size:1.2rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;}
.nav-pill{display:flex;align-items:center;gap:.1rem;background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:50px;padding:.4rem .5rem;box-shadow:0 2px 20px rgba(0,0,0,0.08);}
.nav-pill a{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);text-decoration:none;padding:.4rem .9rem;border-radius:50px;transition:all .2s;white-space:nowrap;}
.nav-pill a:hover{color:var(--ink);background:rgba(0,0,0,0.04);}
.nav-pill .cta{background:var(--ink);color:#fff!important;margin-left:.2rem;}
.nav-pill .cta:hover{background:var(--gold)!important;color:var(--ink)!important;}

/* HERO — орбита */
#hero{height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.hero-bg{position:absolute;inset:0;background:var(--bg);}
.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;user-select:none;text-align:center;z-index:0;}
.wm span{font-family:'Tenor Sans',sans-serif;font-size:clamp(5rem,16vw,13rem);font-weight:300;line-height:.85;letter-spacing:-.02em;text-transform:uppercase;color:var(--ink);opacity:.025;display:block;}
.orbit-scene{position:absolute;inset:0;z-index:1;}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0;}
.cw{position:absolute;transform:translate(-50%,-50%);cursor:pointer;}
.cw:hover .card{box-shadow:0 20px 60px rgba(0,0,0,0.15);transform:scale(1.07) rotate(var(--cr))!important;}
.card{width:120px;height:160px;border-radius:40px;overflow:hidden;position:relative;transition:box-shadow .3s,transform .3s;}
.card-img{width:168px;height:168px;position:absolute;left:-24px;top:-4px;pointer-events:none;}
/* Подписи — крупные, всегда читабельные */
.card-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Tenor Sans',sans-serif;font-size:1rem;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,0.5);text-align:center;line-height:1.2;padding:.5rem;}

/* CORNER */
.corner{position:absolute;z-index:2;pointer-events:none;}
.corner-bl{bottom:2rem;left:2.5rem;}
.corner-br{bottom:2rem;right:2.5rem;text-align:right;}
.corner p{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);line-height:2;}
.corner strong{color:var(--ink);font-weight:500;}

/* SECTIONS */
.section{padding:4rem 2.5rem;border-bottom:1px solid var(--border);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.stat{padding:1.5rem 2rem;border-right:1px solid var(--border);text-align:center;}
.stat:last-child{border-right:none;}
.stat-num{font-family:'Tenor Sans',sans-serif;font-size:2.6rem;font-weight:300;color:var(--gold);display:block;margin-bottom:.25rem;}
.stat-lbl{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);}

/* SERVICES GRID */
.sh{padding:3rem 2.5rem 2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;}
.sh-tag{font-size:.65rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem;}
.sh-title{font-family:'Tenor Sans',sans-serif;font-size:2.2rem;font-weight:300;color:var(--ink);}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);}
.scard{padding:2rem 1.75rem;border-right:1px solid var(--border);cursor:pointer;transition:background .2s;display:flex;flex-direction:column;}
.scard:last-child{border-right:none;}
.scard:hover{background:var(--bg2);}
.scard-num{font-family:'Tenor Sans',sans-serif;font-size:.8rem;color:var(--gold);margin-bottom:1rem;opacity:.8;}
.scard-icon{font-size:1.4rem;color:var(--gold);margin-bottom:1rem;}
.scard-name{font-family:'Tenor Sans',sans-serif;font-size:1.3rem;font-weight:300;line-height:1.3;margin-bottom:.6rem;color:var(--ink);}
.scard-desc{font-size:.78rem;line-height:1.75;color:var(--ink-muted);flex:1;margin-bottom:1.25rem;}
.scard-footer{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--border);padding-top:.85rem;display:flex;justify-content:space-between;}

/* FEATURE */
.feature{display:grid;grid-template-columns:3fr 2fr;border-bottom:1px solid var(--border);}
.feature-text{padding:3.5rem 2.5rem;border-right:1px solid var(--border);}
.feature-visual{background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;min-height:300px;}
.feature-eyebrow{font-size:.65rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:.75rem;}
.feature-title{font-family:'Tenor Sans',sans-serif;font-size:2.8rem;font-weight:300;line-height:1.05;margin-bottom:1.25rem;}
.feature-title em{font-style:italic;color:var(--gold);}
.feature-desc{font-size:.88rem;line-height:1.85;color:var(--ink-muted);max-width:420px;margin-bottom:2rem;}
.feature-details{display:flex;gap:2.5rem;margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.detail-lbl{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);display:block;margin-bottom:4px;}
.detail-val{font-family:'Tenor Sans',sans-serif;font-size:1.2rem;font-weight:300;}

/* DESTINATIONS */
.dest-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);}
.dest{padding:2.5rem;border-right:1px solid var(--border);cursor:pointer;transition:background .2s;}
.dest:last-child{border-right:none;}
.dest:hover{background:var(--bg2);}
.dest-flag{font-size:2rem;margin-bottom:.75rem;}
.dest-name{font-family:'Tenor Sans',sans-serif;font-size:2rem;font-weight:300;margin-bottom:.75rem;}
.dest-info{font-size:.78rem;line-height:1.75;color:var(--ink-muted);margin-bottom:1.25rem;}
.dest-cta{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--border);padding-top:.85rem;display:block;}

/* QUOTE */
.quote-section{padding:5rem 2.5rem;text-align:center;background:var(--bg2);border-bottom:1px solid var(--border);}
.quote-mark{font-family:'Tenor Sans',sans-serif;font-size:5rem;font-weight:300;color:var(--gold);line-height:.5;margin-bottom:1rem;opacity:.4;display:block;}
.quote-text{font-family:'Tenor Sans',sans-serif;font-size:1.85rem;font-weight:300;font-style:italic;line-height:1.45;max-width:580px;margin:0 auto 1.5rem;color:var(--ink);}
.quote-author{font-size:.65rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);}

/* BUTTONS */
.btn-gold{font-family:'Jost',sans-serif;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;background:var(--ink);color:#fff;border:none;padding:.9rem 2rem;cursor:pointer;font-weight:500;transition:background .2s;text-decoration:none;display:inline-block;}
.btn-gold:hover{background:var(--gold);color:var(--ink);}
.btn-outline{font-family:'Jost',sans-serif;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mid);background:none;border:1px solid var(--border);padding:.85rem 1.8rem;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block;}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-row{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.75rem;align-items:center;}

/* FOOTER */
.site-footer{background:var(--bg2);padding:2rem 2.5rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);flex-wrap:wrap;gap:1.5rem;}
.footer-logo{font-family:'Tenor Sans',sans-serif;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;}
.footer-links{display:flex;gap:2rem;list-style:none;flex-wrap:wrap;}
.footer-links a{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);text-decoration:none;transition:color .2s;}
.footer-links a:hover{color:var(--gold);}
.footer-socials{display:flex;gap:.6rem;}
.social-btn{width:34px;height:34px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-muted);text-decoration:none;transition:all .2s;}
.social-btn:hover{border-color:var(--gold);color:var(--gold);}
.social-btn svg{width:15px;height:15px;fill:currentColor;}

@media(max-width:900px){
  nav{padding:1rem 1.4rem;}
  .nav-pill a:not(.cta){display:none;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .feature{grid-template-columns:1fr;}
  .feature-text{border-right:none;border-bottom:1px solid var(--border);}
  .dest-grid{grid-template-columns:1fr;}
  .dest{border-right:none;border-bottom:1px solid var(--border);}
  .site-footer{flex-direction:column;align-items:flex-start;}
  .corner{display:none;}
}
</style>
</head>
<body>

<!-- NAV — z-index 9999, всегда поверх -->
<nav>

<script>
var DATA=[
  {label:'Подкасты',url:'/lectures',bg:'linear-gradient(135deg,#ddd5c8 0%,#b89a72 50%,#cec0a8 100%)'},
  {label:'Гайд',url:'/color-guide',bg:'linear-gradient(135deg,#ede7df 0%,#c4a882 50%,#e0d4c0 100%)'},
  {label:'Контакты',url:'/contacts',bg:'linear-gradient(135deg,#e4ddd5 0%,#a89070 45%,#d6cabb 100%)'},
  {label:'записаться 
на консультацию',url:'/booking',bg:'linear-gradient(135deg,#e8dfd4 0%,#c9a96e 50%,#d4b896 100%)'}
];
var POSITIONS=[
  {left:'15%',top:'18%',w:150,h:190,deg:-8},
  {left:'58%',top:'12%',w:130,h:170,deg:6},
  {left:'22%',top:'55%',w:140,h:180,deg:4},
  {left:'60%',top:'52%',w:155,h:195,deg:-5}
];
var hero=document.getElementById('hero');
DATA.forEach(function(d,i){
  var p=POSITIONS[i];
  var card=document.createElement('div');
  card.style.cssText='position:absolute;left:'+p.left+';top:'+p.top+';width:'+p.w+'px;height:'+p.h+'px;border-radius:32px;background:'+d.bg+';cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(24px) rotate('+p.deg+'deg);transition:opacity .6s ease,transform .6s ease,box-shadow .3s;box-shadow:0 4px 24px rgba(0,0,0,0.07);';
  var lbl=document.createElement('div');
  lbl.textContent=d.label;
  lbl.style.cssText='font-family:"Tenor Sans",sans-serif;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,0.3);text-align:center;';
  card.appendChild(lbl);
  card.addEventListener('mouseenter',function(){this.style.boxShadow='0 12px 40px rgba(0,0,0,0.15)';this.style.transform='translateY(-4px) rotate('+p.deg+'deg)';});
  card.addEventListener('mouseleave',function(){this.style.boxShadow='0 4px 24px rgba(0,0,0,0.07)';this.style.transform='translateY(0) rotate('+p.deg+'deg)';});
  card.addEventListener('click',function(){location.href=d.url;});
  hero.appendChild(card);
  setTimeout(function(){card.style.opacity='1';card.style.transform='translateY(0) rotate('+p.deg+'deg)';},200+i*150);
});
</script>
