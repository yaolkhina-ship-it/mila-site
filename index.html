<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мила Ушакова</title>
<meta name="description" content="Мила Ушакова — image expert и fashion analyst. Автор Системы цветовых сочетаний и Системы имиджа.">
<link rel="preload" as="image" href="mila-stairs.webp" type="image/webp" fetchpriority="high" media="(min-width:821px)">
<link rel="preload" as="image" href="mila-stairs-m.webp" type="image/webp" fetchpriority="high" media="(max-width:820px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,300;6..96,400;6..96,500&family=Montserrat:wght@300;400;500;600&display=swap">
<style>
:root{
  --paper:#FFFFFF;
  --ink:#111111;
  --mute:#7A7A7A;
  --rule:#E3E3E3;
  --gold:#C9A96A;
  --soft:#F7F5F1;
  --f:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --serif:'Bodoni Moda',Didot,'Times New Roman',serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font:400 15px/1.55 var(--f);
  letter-spacing:.01em;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:none;color:inherit;cursor:pointer}
.g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.in{max-width:1320px;margin:0 auto;min-width:0}

header.hd{
  position:fixed;inset:0 0 auto 0;z-index:20;
  background:transparent;
  border-bottom:1px solid transparent;
  transition:border-color .3s,background .3s,color .3s;
  color:#fff;
}
header.hd.is-solid{
  border-color:var(--rule);
  background:rgba(255,255,255,.96);
  color:var(--ink);
  backdrop-filter:blur(10px);
}
.hd .row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:.75rem 1.25rem;
  /* меню чуть ниже, как просила Мила */
  padding-block:clamp(28px,4.5vh,40px) 18px;
}
.monogram{
  justify-self:start;
  font-family:var(--serif);
  font-weight:400;
  font-size:32px;
  line-height:1;
  letter-spacing:.08em;
  color:var(--gold);
}
.nav-desk{
  justify-self:center;
  display:flex;
  flex-wrap:nowrap;
  gap:clamp(14px,2.4vw,36px);
  align-items:center;
  max-width:100%;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.nav-desk::-webkit-scrollbar{display:none}
.nav-desk a{
  font-size:clamp(11px,1.15vw,13px);
  font-weight:500;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:#fff;
  opacity:1;
  transition:opacity .2s,color .2s;
  white-space:nowrap;
}
.nav-desk a:hover{color:var(--gold)}
header.hd.is-solid .nav-desk a{color:var(--ink)}
.menu-btn{
  justify-self:end;
  width:26px;height:16px;
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.menu-btn span,
.menu-btn::before,
.menu-btn::after{
  content:"";
  position:absolute;left:0;right:0;
  height:1.5px;
  background:currentColor;
  transition:transform .3s,opacity .3s,top .3s;
}
.menu-btn span{top:50%;transform:translateY(-50%)}
.menu-btn::before{top:1px}
.menu-btn::after{bottom:1px}
.menu-btn.is-open span{opacity:0}
.menu-btn.is-open::before{top:50%;transform:translateY(-50%) rotate(45deg)}
.menu-btn.is-open::after{bottom:auto;top:50%;transform:translateY(-50%) rotate(-45deg)}

.nav-panel{
  position:fixed;inset:0;z-index:30;
  background:rgba(12,12,12,.96);
  display:flex;flex-direction:column;justify-content:center;
  padding:5rem max(24px,env(safe-area-inset-right,0px)) 3rem max(24px,env(safe-area-inset-left,0px));
  opacity:0;visibility:hidden;
  transition:opacity .35s,visibility .35s;
}
.nav-panel.is-open{opacity:1;visibility:visible}
.nav-panel a{
  font-weight:500;
  font-size:clamp(1.05rem,3.2vw,1.35rem);
  text-transform:uppercase;
  letter-spacing:.1em;
  color:rgba(255,255,255,.9);
  padding:.75rem 0;
  border-bottom:1px solid rgba(255,255,255,.12);
  transform:translateY(8px);opacity:0;
  transition:color .2s,opacity .35s,transform .35s;
}
.nav-panel.is-open a{opacity:1;transform:none}
.nav-panel.is-open a:nth-of-type(1){transition-delay:.04s}
.nav-panel.is-open a:nth-of-type(2){transition-delay:.08s}
.nav-panel.is-open a:nth-of-type(3){transition-delay:.12s}
.nav-panel.is-open a:nth-of-type(4){transition-delay:.16s}
.nav-panel.is-open a:nth-of-type(5){transition-delay:.2s}
.nav-panel a:hover{color:var(--gold)}
.nav-close{
  position:absolute;top:1.35rem;right:1.35rem;
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.55);
}
.nav-close:hover{color:var(--gold)}

/* cinematic hero — как на макете */
.hero{
  position:relative;
  min-height:100svh;
  overflow:hidden;
  background:#1a120c;
  color:#fff;
}
.hero-media{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:58% 28%;
  transform:scale(1);
  animation:heroIn 1.2s ease both;
}
@keyframes heroIn{
  from{opacity:0}
  to{opacity:1}
}
.hero::after{
  content:"";
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(12,8,4,.55) 0%,rgba(12,8,4,.22) 42%,rgba(12,8,4,.05) 70%,transparent 100%),
    linear-gradient(180deg,rgba(12,8,4,.28) 0%,transparent 28%,rgba(12,8,4,.18) 100%);
  pointer-events:none;
}
.hero-cap{
  position:relative;z-index:2;
  min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;
  align-items:stretch;
  padding:6.5rem 0 4rem;
  text-align:left;
}
.hero-cap .in{
  width:100%;
  max-width:1320px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  text-align:left;
}
.hero h1{
  margin:0;
  font-family:var(--serif);
  font-weight:300;
  font-size:clamp(56px,8vw,104px);
  line-height:.86;
  letter-spacing:.06em;
  text-transform:uppercase;
  max-width:10ch;
  text-align:left;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  opacity:0;transform:translateY(18px);
  animation:rise 1s .35s ease both;
}
.hero-roles{
  margin-top:1.5rem;
  font-size:10px;font-weight:400;
  letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.88);
  line-height:2;
  opacity:0;transform:translateY(14px);
  animation:rise .9s .55s ease both;
}
.hero-roles span{display:block}
.hero-rule{
  margin-top:1.4rem;
  width:48px;height:1px;
  background:rgba(255,255,255,.85);
  opacity:0;
  animation:rise .8s .7s ease both;
}
@media (min-width:900px){
  .hero-media{object-position:62% 30%}
  .hero-cap{padding:7rem 0 5rem}
}
@keyframes rise{
  to{opacity:1;transform:none}
}

.social-br{
  position:fixed;right:18px;bottom:18px;z-index:25;
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);
  transition:color .2s,background .2s;
}
.social-br:hover{color:var(--ink)}
@media (max-width:820px){
  .g{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
  .hero-media{object-position:52% 20%}
  .hero::after{
    background:
      linear-gradient(180deg,rgba(12,8,4,.35) 0%,transparent 32%,rgba(12,8,4,.62) 100%);
  }
  /* имя ниже + тоньше; меню крупнее и ниже */
  .hero-cap{
    justify-content:flex-end;
    padding-top:6rem;
    padding-bottom:calc(4.25rem + env(safe-area-inset-bottom,0px));
  }
  .hero h1{
    font-size:clamp(52px,14vw,68px);
    font-weight:300;
    max-width:100%;
    letter-spacing:.05em;
    padding-right:.1em;
  }
  .hero-roles{font-size:9px;letter-spacing:.2em;max-width:100%}
  .hd .row{padding-block:34px 12px;gap:.5rem .6rem}
  .monogram{font-size:24px}
  .nav-desk{gap:clamp(8px,2.2vw,14px)}
  .nav-desk a{font-size:10px;font-weight:500;letter-spacing:.1em}
  .nav-panel a{letter-spacing:.08em;padding-right:.25rem}
  .social-br{
    writing-mode:horizontal-tb;
    transform:none;
    right:max(16px,env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    left:auto;
    padding:10px 12px;
    background:rgba(255,255,255,.92);
    border:1px solid var(--rule);
    letter-spacing:.1em;
    font-size:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.06);
  }
  .social-br:hover{color:var(--gold)}
}

@media (prefers-reduced-motion:reduce){
  .hero-media,.hero-roles,.hero h1,.hero-rule{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="hd" id="hd">
  <div class="g"><div class="in row">
    <a class="monogram" href="./" aria-label="Мила Ушакова">MU</a>
    <nav class="nav-desk" aria-label="Основное меню">
      <a href="https://www.milaushakova.com/booking">Обо мне</a>
      <a href="https://www.milaushakova.com/color-guide">Проекты</a>
      <a href="https://www.milaushakova.com/image">Система имиджа</a>
      <a href="https://t.me/MilaUshakova_ClubBot?start=club" target="_blank" rel="noopener">Клуб</a>
      <a href="https://t.me/MilaUshakova_ClubBot?start=support" target="_blank" rel="noopener">Контакты</a>
    </nav>
    <button class="menu-btn" type="button" aria-label="Меню" aria-expanded="false" aria-controls="nav-panel"><span></span></button>
  </div></div>
</header>

<nav class="nav-panel" id="nav-panel" hidden>
  <button class="nav-close" type="button" aria-label="Закрыть">Закрыть</button>
  <a href="https://www.milaushakova.com/booking">Обо мне</a>
  <a href="https://www.milaushakova.com/color-guide">Проекты</a>
  <a href="https://www.milaushakova.com/image">Система имиджа</a>
  <a href="https://t.me/MilaUshakova_ClubBot?start=club" target="_blank" rel="noopener">Клуб</a>
  <a href="https://t.me/MilaUshakova_ClubBot?start=support" target="_blank" rel="noopener">Контакты</a>
</nav>

<main>
  <section class="hero" aria-label="Мила Ушакова">
    <picture>
      <source media="(max-width:820px)" srcset="mila-stairs-m.webp" type="image/webp">
      <source media="(max-width:820px)" srcset="mila-stairs-m.jpg" type="image/jpeg">
      <source srcset="mila-stairs.webp" type="image/webp">
      <img class="hero-media" src="mila-stairs.jpg" alt="Мила Ушакова" width="1200" height="1800" decoding="async" fetchpriority="high">
    </picture>
    <div class="hero-cap g"><div class="in">
      <h1>Мила<br>Ушакова</h1>
      <p class="hero-roles">
        <span>Международный стилист</span>
        <span>Журналист | Аналитик</span>
        <span>Эксперт по имиджу</span>
      </p>
      <div class="hero-rule" aria-hidden="true"></div>
    </div></div>
  </section>
</main>

<a class="social-br" href="https://t.me/MilaUshakova_ClubBot?start=support" target="_blank" rel="noopener">Служба заботы</a>

<script>
(() => {
  const btn = document.querySelector('.menu-btn');
  const panel = document.getElementById('nav-panel');
  const closeBtn = document.querySelector('.nav-close');

  const setOpen = (open) => {
    btn.classList.toggle('is-open', open);
    panel.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    panel.hidden = !open;
    document.body.style.overflow = open ? 'hidden' : '';
  };
  btn.addEventListener('click', () => setOpen(!panel.classList.contains('is-open')));
  closeBtn.addEventListener('click', () => setOpen(false));
  panel.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => setOpen(false)));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
})();
</script>
</body>
</html>
