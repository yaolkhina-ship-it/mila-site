<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Материалы клуба</title>
<script src="/club/tg.js"></script>
<link href="/club/fonts/fonts.css" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--ink:#e9dcc0;--hi:#f3e6c8;--gold:#c8a45c;--gold2:rgba(200,164,92,.5);--line:rgba(200,164,92,.2);--mute:#9d927c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Forum',serif;font-size:17px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
img{display:block;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.deco{font-family:'Poiret One',sans-serif}
.orn{color:var(--gold);letter-spacing:.5em;font-size:11px;font-family:'Poiret One'}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px 30px}
.sec{font-family:'Poiret One';text-align:center;letter-spacing:.3em;font-size:13px;color:var(--gold);margin:34px 0 14px;display:flex;align-items:center;gap:12px;padding:0 22px}
.sec:before,.sec:after{content:"";flex:1;height:1px;background:var(--line)}

.hd{padding:34px 22px 0;text-align:center}
.hd h1{font-family:'Poiret One';font-weight:400;font-size:42px;line-height:1;letter-spacing:.04em;margin:12px 0 6px;color:var(--hi)}
.hello{margin-top:14px;color:var(--mute);font-size:15px}

.search{margin:20px 22px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--gold2);padding:8px 2px}
.search svg{flex:none;opacity:.8}
.search input{flex:1;background:none;border:0;outline:0;color:var(--hi);font:inherit;font-size:17px}
.search input::placeholder{color:#7d735f}
.search .x{color:var(--gold);font-size:20px;line-height:1;display:none}
.search.on .x{display:block}

.hero{margin:22px 22px 0;position:relative;border:1px solid var(--gold);padding:6px;display:block;width:calc(100% - 44px);text-align:left}
.hero img{width:100%;height:300px}
.hero .cap{position:absolute;left:6px;right:6px;bottom:6px;padding:50px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.88))}
.cap small,.meta{font-family:'Poiret One';color:var(--gold);letter-spacing:.16em;font-size:11.5px;text-transform:uppercase}
.cap b{display:block;font-weight:400;font-size:24px;line-height:1.12;margin-top:6px;color:var(--hi)}
.cap .go{display:inline-block;margin-top:10px;font-family:'Poiret One';font-size:12px;letter-spacing:.2em;color:var(--gold);border:1px solid var(--gold2);padding:6px 12px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 22px}
.g{position:relative;border:1px solid var(--gold2);display:block;width:100%;overflow:hidden}
.g img{width:100%;height:150px;filter:sepia(.25) contrast(1.05);transition:transform .5s}
.g:active img{transform:scale(1.04)}
.g span{position:absolute;left:0;right:0;bottom:0;padding:24px 8px 9px;text-align:center;background:linear-gradient(transparent,#000);font-family:'Poiret One';font-size:15px;letter-spacing:.06em;color:var(--hi)}
.g span i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.2em;color:var(--gold);margin-top:3px}
.g.wide{grid-column:1/-1}.g.wide img{height:130px}

.it{display:flex;gap:14px;padding:13px 22px;align-items:center;border-bottom:1px solid var(--line);width:100%;text-align:left}
.it:active{background:rgba(200,164,92,.06)}
.it img{flex:none;width:58px;height:58px;border-radius:50%;border:1px solid var(--gold);filter:sepia(.2)}
.it .tx{min-width:0;flex:1}
.it b{display:block;font-weight:400;font-size:17px;line-height:1.18;color:var(--hi);margin-top:3px}
.it p{margin:4px 0 0;color:var(--mute);font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.shelf{display:flex;gap:12px;overflow-x:auto;padding:0 22px 4px;scroll-snap-type:x mandatory;scroll-padding-left:22px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.card{flex:none;width:172px;scroll-snap-align:start;text-align:left}
.card .fr{border:1px solid var(--gold2);padding:4px;position:relative}
.card img{width:100%;height:210px;filter:sepia(.2)}
.card .pl{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(11,11,12,.75);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center}
.card b{display:block;font-weight:400;font-size:16px;line-height:1.18;margin-top:8px;color:var(--hi)}
.card .meta{display:block;margin-top:9px}

.banner{position:relative;height:230px;overflow:hidden;border-bottom:1px solid var(--gold)}
.banner img{width:100%;height:100%;filter:sepia(.3) brightness(.62)}
.banner .t{position:absolute;inset:auto 0 0 0;padding:20px 22px 22px;text-align:center;background:linear-gradient(transparent,rgba(11,11,12,.9))}
.banner h2{font-family:'Poiret One';font-weight:400;font-size:36px;margin:8px 0 4px;color:var(--hi);letter-spacing:.04em}
.banner p{margin:6px 0 0;color:var(--ink);font-size:15px;line-height:1.35;opacity:.85}

.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 22px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:'Poiret One';font-size:13px;letter-spacing:.12em;border:1px solid var(--gold2);color:var(--ink);padding:7px 13px;text-transform:uppercase}
.chip.on{background:var(--gold);color:#0b0b0c;border-color:var(--gold)}
.month{font-family:'Poiret One';color:var(--gold);letter-spacing:.3em;font-size:12px;padding:26px 22px 6px;text-transform:uppercase}

.more{display:block;margin:18px auto 0;font-family:'Poiret One';font-size:13px;letter-spacing:.2em;color:var(--gold);border:1px solid var(--gold2);padding:10px 20px;text-transform:uppercase}
.empty{text-align:center;color:var(--mute);padding:40px 30px;line-height:1.4}

.state{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px}
.state h1{font-family:'Poiret One';font-weight:400;font-size:34px;line-height:1.05;color:var(--hi);margin:16px 0 14px;letter-spacing:.04em}
.state p{color:var(--ink);opacity:.85;line-height:1.45;margin:0 0 24px;max-width:320px}
.lf{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.lf input{font:inherit;font-size:17px;background:transparent;color:var(--hi);border:0;border-bottom:1px solid var(--gold2);padding:10px 2px;outline:0;border-radius:0}
.lf input:focus{border-color:var(--gold)}
.lf .btn{margin-top:10px}
.lf .err{color:#e08a7a;font-size:15px;min-height:20px}
.lf .alt{margin-top:18px;font-size:15px;color:var(--mute);text-decoration:underline;background:none}
.sback{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--line);font-family:'Poiret One';letter-spacing:.18em;font-size:12.5px;color:var(--gold);text-transform:uppercase}
.sback button{color:var(--gold);font:inherit;letter-spacing:inherit;background:none}
.read{padding:26px 24px 60px;max-width:680px;margin:0 auto}
.read h2{font-family:'Poiret One';font-weight:400;font-size:28px;line-height:1.15;color:var(--hi);margin:8px 0 18px}
.read .tx{white-space:pre-wrap;line-height:1.6;font-size:17.5px}
.read .note{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:15px;line-height:1.5}
.read .note a,.read .tx a{color:var(--gold);word-break:break-all}
.v2 .sback,.v2 .sback button{background:#fff;color:#111}.v2 .read h2{font-family:'Prata',serif;color:#111}.v2 .lf input{color:#111;border-color:#bbb}
.state .frame{border:1px solid var(--gold);padding:5px;margin-bottom:24px}
.state .frame img{width:180px;height:220px;filter:sepia(.25)}
.btn{font-family:'Poiret One';font-size:14px;letter-spacing:.2em;text-transform:uppercase;background:var(--gold);color:#0b0b0c;padding:13px 26px}
.pulse{animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.foot{text-align:center;margin-top:36px}

/* ── Стиль 2 «Vogue»: белый, чёрный, красный акцент ── */
body.v2{--bg:#fff;--ink:#111;--hi:#111;--gold:#d4001a;--gold2:rgba(17,17,17,.22);--line:#ececec;--mute:#7a7a7a;font-family:'Tenor Sans',sans-serif;font-size:16px}
body.v2,.v2 html{background:#fff}
.v2 .orn{display:none}
.v2 .sec,.v2 .month,.v2 .meta,.v2 .cap small,.v2 .chip,.v2 .more,.v2 .btn,.v2 .cap .go,.v2 .g span i{font-family:'Tenor Sans',sans-serif}
.v2 .sec{justify-content:space-between;text-align:left;letter-spacing:.24em;font-size:11px;color:#111;margin:30px 0 12px;padding:0 18px}
.v2 .sec:before{display:none}.v2 .sec:after{content:"";flex:0 0 28px;height:2px;background:#d4001a}
.v2 .rule{display:none}
.v2 .vhd{padding:30px 18px 12px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #111}
.v2 .vhd .logo{font-family:'Prata',serif;font-size:50px;line-height:.8;letter-spacing:-.02em}
.v2 .vhd small{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;text-align:right;line-height:1.6}

.v2 .search{margin:14px 18px 0;border-bottom:1px solid #111}
.v2 .search input{color:#111}.v2 .search input::placeholder{color:#9a9a9a}
.v2 .hero{margin:18px 0 0;border:0;padding:0;width:100%}
.v2 .hero img{height:440px}
.v2 .hero .cap{left:0;right:0;bottom:0;padding:80px 18px 20px;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.v2 .cap small{background:#d4001a;color:#fff;padding:4px 8px;letter-spacing:.18em;font-size:10px}
.v2 .cap b{font-family:'Prata',serif;font-size:34px;line-height:1.02;color:#fff;margin-top:12px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.v2 .cap .go{color:#fff;border-color:rgba(255,255,255,.7);letter-spacing:.2em}
.v2 .grid{padding:0 18px;gap:14px 12px}
.v2 .g{border:0}
.v2 .g img{filter:none;height:190px}
.v2 .g span{position:static;background:none;padding:8px 0 0;text-align:left;font-family:'Prata',serif;font-size:17px;letter-spacing:0;color:#111;display:flex;justify-content:space-between;align-items:baseline}
.v2 .g span i{display:inline;color:#d4001a;font-size:10px;letter-spacing:.16em;margin:0}
.v2 .g.wide img{height:170px}
.v2 .it{padding:14px 18px;border-bottom:1px solid #ececec}
.v2 .it:active{background:#f6f6f6}
.v2 .it img{width:64px;height:82px;border-radius:0;border:0;filter:none}
.v2 .it b{font-family:'Prata',serif;font-size:17px;color:#111}
.v2 .meta{color:#d4001a;letter-spacing:.16em;font-size:10px}
.v2 .it p{color:#7a7a7a;font-size:13px}
.v2 .shelf{padding:0 18px 4px;scroll-padding-left:18px}
.v2 .card{width:156px}
.v2 .card .fr{border:0;padding:0}
.v2 .card img{height:208px;filter:none}
.v2 .card .pl{background:#d4001a;border:0}
.v2 .card .pl path{fill:#fff}
.v2 .card b{font-family:'Prata',serif;color:#111}
.v2 .banner{height:330px;border-bottom:0}
.v2 .banner img{filter:none}
.v2 .banner .t{text-align:left;padding:30px 18px 20px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.v2 .banner h2{font-family:'Prata',serif;font-size:40px;color:#fff;letter-spacing:-.01em;line-height:1}
.v2 .banner p{color:#fff;opacity:.9;font-size:14px}
.v2 .banner .kick{display:inline-block;background:#d4001a;color:#fff;font-size:10px;letter-spacing:.18em;padding:4px 8px;text-transform:uppercase}
.banner .kick{display:none}

.v2 .chip{border-color:#111;color:#111;font-size:11px;letter-spacing:.14em}
.v2 .chip.on{background:#111;color:#fff;border-color:#111}

.v2 .more{color:#111;border-color:#111;font-size:11px}
.v2 .state h1{font-family:'Prata',serif;color:#111}
.v2 .state .frame{border:0;padding:0}.v2 .state .frame img{filter:none}
.v2 .btn{background:#d4001a;color:#fff}
.v2 .hello{color:#7a7a7a;font-size:13px;margin:0}
</style>

<body>
<div id="app"><div class="state"><div class="orn pulse">◆ ◆ ◆</div></div></div>
<script>
(function(){
var tg = window.Telegram && Telegram.WebApp;
var BOT = 'https://t.me/MilaUshakova_ClubBot';
var API = '/club/api/materials';
var LOGIN_API = '/club/api/login';
// Вход по логину и паролю: для тех, у кого не открывается Telegram
var TOK_KEY = 'club_site_token';
function tokGet(){ try { return localStorage.getItem(TOK_KEY) || ''; } catch(e){ return ''; } }
function tokSet(v){ try { v ? localStorage.setItem(TOK_KEY, v) : localStorage.removeItem(TOK_KEY); } catch(e){} }
var SITE = false;
var app = document.getElementById('app');

// Обложки: картины и мода, у каждой рубрики своя подборка
var IMG = {
  vybor:['email-elle-cover','webinar-jewelry','email-leopard'],
  dna:['webinar-runway','masshtab-og','art_winter'],
  nasmotr:['email-lea-seydoux','art_caillebotte','art_manet'],
  art:['art_vermeer','art_klimt','art_monet','art_venus','art_fragonard'],
  garderob:['art_agnew','art_madamex','mnogosloynost-cover'],
  weekend:['art_renoir','art_degas'],
  events:['mila-portrait','mila-portrait-2']
};
var MORE = {vybor:14, dna:17, nasmotr:18, art:24, weekend:19, events:8};
Object.keys(MORE).forEach(function(r){ for (var n = 0; n < MORE[r]; n++) IMG[r].push('p/' + r + n); });
var ORDER = ['vybor','dna','nasmotr','art','weekend','events'];
var ABOUT = {
  vybor:'Что купить и почему: бренды, вещи, украшения, аксессуары.',
  dna:'История и визуальный язык модных домов.',
  nasmotr:'Показы, стритстайл и работа стилистов. Учимся видеть.',
  art:'Живопись, кино, фотография и эпохи. Моду невозможно понимать вне искусства.',
  garderob:'Разборы ваших образов и вещей.',
  weekend:'Фильмы, книги, журналы и наблюдения на выходные.',
  events:'Встречи, эфиры и лекции гостей.'
};
var TYPES = ['лекция','подкаст','подборка','пост','анонс','видео'];
var PLURAL = {'лекция':'Лекции','подкаст':'Подкасты','разбор':'Разборы','подборка':'Подборки','пост':'Посты','анонс':'Анонсы','видео':'Видео'};
var DAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

var D = null, RUB = {}, stack = [];

function img(it, i){ var a = IMG[it.r] || IMG.art; return '/club/img/' + a[((i == null ? it.pic : it.pic + i) || 0) % a.length] + '.jpg'; }
// Картинки по порядку внутри рубрики: соседние материалы никогда не повторяются
function pics(items){
  var k = {};
  items.slice().reverse().forEach(function(it){ var n = k[it.r] = (k[it.r] || 0) + 1; it.pic = n + 1; });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function msk(t){ return new Date((t + 3 * 3600) * 1000); } // дата по Москве в UTC-полях
var MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONN = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function dshort(t){ var d = msk(t); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()].slice(0, 3); }
var GENERIC = {'Подкаст Милы':1,'Видео':1,'Лекция':1,'Материал':1};
var CODE = /^(код доступа|секретный код|пароль)/i;
function bare(it){ return CODE.test(it.h || '') || (!it.s && (GENERIC[it.h] || !/[A-Za-zА-Яа-яЁё]/.test(it.h || ''))); }
// Записи эфиров в канале выглядят как ссылка с кодом доступа: это лекции
var REC = /запис[ьи]\s+(нашего\s+)?(эфира|беседы|вебинара|лекции|встречи)|#запись|код доступа|секретный код|приятного просмотра|\d+\s*минут[аы]?\s*$/i;
function lectures(items){
  items.forEach(function(i){
    if (i.k !== 'лекция' && REC.test(i.h + ' ' + i.s)) { i.k = 'лекция'; i.r = 'events'; }
    if (i.k === 'лекция' && (CODE.test(i.h || '') || /^запись эфира$/i.test(i.h))) i.h = 'Запись эфира';
  });
}
// Голосовое или видео без подписи берёт заголовок соседнего поста с текстом (Мила выкладывает их рядом)
function adopt(items){
  items.forEach(function(it, n){
    if (!bare(it)) return;
    if (it.k === 'видео' && it.d < 300) { it.drop = 1; return; } // короткий ролик без подписи
    var best = null;
    for (var j = Math.max(0, n - 4); j < Math.min(items.length, n + 5); j++) {
      var o = items[j];
      if (o === it || bare(o) || Math.abs(o.t - it.t) > 1800) continue;
      if (!best || Math.abs(o.t - it.t) < Math.abs(best.t - it.t)) best = o;
    }
    if (!best) return;
    // Короткое видео без подписи это часть поста рядом: в списке не дублируем
    if (it.k !== 'подкаст' && it.k !== 'лекция') { it.drop = 1; return; }
    it.h = best.h; it.r = best.r; it.tags = best.tags; it.s = best.s;
    if (best.k === 'пост' || best.k === 'анонс') best.drop = 1; // подпись к подкасту: показываем один раз, сам подкаст
  });
}
function title(it){
  if (/[A-Za-zА-Яа-яЁё]/.test(it.h || '')) return it.h;
  if (it.s && /[A-Za-zА-Яа-яЁё]/.test(it.s)) return it.s.slice(0, 56).replace(/\s+\S*$/, '') + '…';
  return ({'подкаст':'Подкаст Милы','лекция':'Лекция','видео':'Видео'})[it.k] || 'Материал';
}
function mins(it){ return it.d >= 45 ? Math.max(1, Math.round(it.d / 60)) + ' мин' : ''; }
function meta(it, withRubric){
  var p = [dshort(it.t)];
  if (withRubric) p.push(RUB[it.r] || '');
  p.push(it.k); if (mins(it)) p.push(mins(it));
  return p.filter(Boolean).join(' · ');
}
function haptic(){ try { tg.HapticFeedback.selectionChanged(); } catch(e){} }

function row(it, withRubric){
  return '<button class="it" data-open="' + it.id + '"><img loading="lazy" src="' + img(it) + '" alt=""><div class="tx"><span class="meta">' +
    esc(meta(it, withRubric)) + '</span><b>' + esc(title(it)) + '</b>' + (it.s && it.h !== it.s ? '<p>' + esc(it.s) + '</p>' : '') + '</div></button>';
}
var PLAY = '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z" fill="#c8a45c"/></svg>';
function card(it){
  return '<button class="card" data-open="' + it.id + '"><div class="fr"><img loading="lazy" src="' + img(it) + '" alt=""><span class="pl">' + PLAY + '</span></div>' +
    '<span class="meta">' + esc(it.k + (mins(it) ? ' · ' + mins(it) : '')) + '</span><b>' + esc(title(it)) + '</b></button>';
}

// ── экраны ──
function home(){
  var items = D.items, now = Date.now() / 1000;
  var dnow = msk(now), dow = (dnow.getUTCDay() + 6) % 7;
  var monday = Math.floor(now / 86400) * 86400 - 3 * 3600 - dow * 86400; // примерно понедельник 00:00 МСК
  var week = items.filter(function(i){ return i.t >= monday; });
  var weekLabel = 'Эта неделя';
  if (week.length < 3) { week = items.slice(0, 6); weekLabel = 'Новое в клубе'; }
  var lect = items.filter(function(i){ return i.k === 'лекция'; });
  var pods = items.filter(function(i){ return i.k === 'подкаст'; });
  var media = lect.concat(pods);
  var hero = lect[0] && lect[0].t > now - 21 * 86400 ? lect[0] : (pods[0] || items[0]);
  var cnt = {}; items.forEach(function(i){ cnt[i.r] = (cnt[i.r] || 0) + 1; });
  var name = D.user && D.user.first_name;
  var h = (dnow.getUTCHours());
  var hi = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
  var html = V2 ? '<div class="view"><div class="vhd"><div class="logo">Клуб</div><small>В моём стиле<br>Мила Ушакова</small></div>' +
    '<div class="issue"><span>Материалы · ' + MONN[dnow.getUTCMonth()] + ' ' + dnow.getUTCFullYear() + '</span>' + (name ? '<b>' + hi + ', ' + esc(name) + '</b>' : '') + '</div>'
  : '<div class="view"><div class="hd"><div class="orn">◆ ◆ ◆</div><h1>МАТЕРИАЛЫ<br>КЛУБА</h1><div class="orn">В МОЁМ СТИЛЕ</div>' +
    (name ? '<div class="hello">' + hi + ', ' + esc(name) + '</div>' : '') + '</div>';
  html +=
    '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="' + (V2 ? '#111' : '#c8a45c') + '" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
    '<input id="q" type="search" placeholder="Найти: тренч, Шанель, цвет…" autocomplete="off"><button class="x" id="qx">×</button></label>' +
    '<div id="res"></div><div id="main">';
  if (hero) html += '<button class="hero" data-open="' + hero.id + '"><img src="' + img(hero, 1) + '" alt=""><div class="cap"><small>' +
    esc(DAYS[msk(hero.t).getUTCDay()] + ' · ' + (RUB[hero.r] || '')) + '</small><b>' + esc(title(hero)) + '</b><span class="go">' +
    (hero.k === 'подкаст' ? 'СЛУШАТЬ' : hero.k === 'лекция' ? 'СМОТРЕТЬ' : 'ОТКРЫТЬ') + (mins(hero) ? ' · ' + mins(hero).toUpperCase() : '') + '</span></div></button>';
  html += '<div class="sec">' + weekLabel.toUpperCase() + '</div>' + week.map(function(i){ return row(i, true); }).join('');
  html += '<div class="sec">РАЗДЕЛЫ</div><div class="grid">' + ORDER.filter(function(r){ return cnt[r]; }).map(function(r, n, a){
    return '<button class="g' + (n === a.length - 1 && a.length % 2 ? ' wide' : '') + '" data-rub="' + r + '"><img loading="lazy" src="/club/img/' + IMG[r][0] + '.jpg" alt=""><span>' +
      esc(RUB[r]) + '<i>' + cnt[r] + '</i></span></button>';
  }).join('') + '</div>';
  if (lect.length) html += '<div class="sec">ЛЕКЦИИ И ЭФИРЫ</div><div class="shelf">' + lect.slice(0, 12).map(card).join('') + '</div>' +
    (lect.length > 2 ? '<button class="more" data-type="lect">ВСЕ ' + lect.length + '</button>' : '');
  if (pods.length) html += '<div class="sec">ПОДКАСТЫ МИЛЫ</div><div class="shelf">' + pods.slice(0, 12).map(card).join('') + '</div>' +
    '<button class="more" data-type="pods">ВСЕ ' + pods.length + '</button>';
  html += '</div><div class="foot rule"></div><div class="foot orn">◆</div></div>';
  return html;
}

function list(items, opts){
  var out = '', last = '';
  var lim = opts.limit || 60;
  items.slice(0, lim).forEach(function(i){
    var d = msk(i.t), m = MONN[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    if (opts.months && m !== last) { out += '<div class="month">' + m + '</div>'; last = m; }
    out += row(i, opts.withRubric);
  });
  if (items.length > lim) out += '<button class="more" data-lim="' + (lim + 60) + '">ПОКАЗАТЬ ЕЩЁ</button>';
  return out || '<div class="empty">Здесь пока пусто</div>';
}

function rubric(st){
  var all = D.items.filter(function(i){ return st.rub ? i.r === st.rub : i.k === (st.media === 'lect' ? 'лекция' : 'подкаст'); });
  var types = TYPES.filter(function(t){ return all.some(function(i){ return i.k === t; }); });
  var items = st.type ? all.filter(function(i){ return i.k === st.type; }) : all;
  var name = st.rub ? RUB[st.rub] : st.media === 'lect' ? 'Лекции и эфиры' : 'Подкасты Милы';
  var pic = st.rub ? IMG[st.rub][1 % IMG[st.rub].length] : st.media === 'lect' ? 'art_klimt' : 'art_degas';
  return '<div class="view"><div class="banner"><img src="/club/img/' + pic + '.jpg" alt=""><div class="t"><div class="orn">◆ ◆ ◆</div><span class="kick">Рубрика</span><h2>' + esc(name) +
    '</h2><p>' + esc(st.rub ? ABOUT[st.rub] : st.media === 'lect' ? 'Записи эфиров, вебинаров и встреч с гостями.' : 'Голосовые подкасты Милы о стиле, брендах и искусстве.') + '</p></div></div>' +
    (types.length > 1 ? '<div class="chips"><button class="chip' + (st.type ? '' : ' on') + '" data-chip="">Все · ' + all.length + '</button>' +
      types.map(function(t){ return '<button class="chip' + (st.type === t ? ' on' : '') + '" data-chip="' + t + '">' + PLURAL[t] + '</button>'; }).join('') + '</div>' : '') +
    list(items, {months: true, withRubric: !st.rub, limit: st.limit}) + '<div class="foot orn">◆</div></div>';
}

function norm(s){ return (s || '').toLowerCase().replace(/ё/g, 'е'); }
function search(q){
  var w = norm(q).split(/\s+/).filter(Boolean);
  if (!w.length) return null;
  return D.items.filter(function(i){
    var hay = norm(title(i) + ' ' + i.s + ' ' + (i.tags || []).join(' ') + ' ' + RUB[i.r] + ' ' + i.k);
    return w.every(function(x){ return hay.indexOf(x) >= 0; });
  });
}

function render(){
  var st = stack[stack.length - 1] || {};
  app.innerHTML = (SITE && stack.length ? '<div class="sback"><button id="sb">‹ Назад</button><span>Материалы клуба</span></div>' : '') +
    (st.read ? reader(st.read) : st.rub || st.media ? rubric(st) : home()) +
    (SITE && !stack.length ? '<div class="foot" style="text-align:center;padding:10px 0 40px"><button class="lf-out" id="out" style="background:none;color:var(--mute);text-decoration:underline;font:inherit;font-size:14px">Выйти</button></div>' : '');
  var sb = document.getElementById('sb'); if (sb) sb.onclick = back;
  var out = document.getElementById('out'); if (out) out.onclick = function(){ tokSet(''); SITE = false; stack = []; loginForm(''); };
  window.scrollTo(0, st.y || 0);
  if (tg && tg.BackButton) { stack.length ? tg.BackButton.show() : tg.BackButton.hide(); }
  var q = document.getElementById('q');
  if (q) {
    var lab = q.parentNode, res = document.getElementById('res'), main = document.getElementById('main');
    var run = function(){
      var r = search(q.value);
      lab.classList.toggle('on', !!q.value);
      if (!r) { res.innerHTML = ''; main.style.display = ''; return; }
      main.style.display = 'none';
      res.innerHTML = '<div class="sec">НАЙДЕНО · ' + r.length + '</div>' + (r.length ? list(r, {withRubric: true, limit: 80}) : '<div class="empty">Ничего не нашлось. Попробуйте другое слово.</div>');
    };
    q.addEventListener('input', run);
    q.addEventListener('keydown', function(e){ if (e.key === 'Enter') q.blur(); });
    document.getElementById('qx').addEventListener('click', function(e){ e.preventDefault(); q.value = ''; run(); });
  }
}

function go(st){
  var cur = stack[stack.length - 1];
  if (cur) cur.y = window.scrollY; else home_y = window.scrollY;
  stack.push(st); haptic(); render();
}
var home_y = 0;
function back(){
  stack.pop();
  render();
  if (!stack.length) window.scrollTo(0, home_y);
}

function open(id){
  var it = D.items.find(function(i){ return i.id == id; });
  if (!it) return;
  haptic();
  if (SITE) return go({read: it.id});
  if (tg && tg.openTelegramLink) tg.openTelegramLink(it.url); else window.open(it.url, '_blank');
}
function reader(id){
  var it = D.items.find(function(i){ return i.id == id; }) || {};
  var media = /video|audio|voice|video_note|photo|document/.test(it.m || '') || it.d > 0;
  var tx = it.x || it.s || '';
  var body = esc(tx).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)»"]/g, function(u){ return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; });
  var extra = (it.ln || []).filter(function(u){ return tx.indexOf(u) < 0 && !/^https:\/\/t\.me\/c\//.test(u); });
  var zoom = (it.ln || []).concat(tx.match(/https?:\/\/[^\s]*zoom\.us[^\s]*/g) || []).length > 0;
  var btns = extra.map(function(u){ return '<a class="btn" style="display:inline-block;margin:6px 8px 0 0;text-decoration:none" href="' + esc(u) + '" target="_blank" rel="noopener">' + (/zoom\.us/.test(u) ? 'Смотреть запись' : 'Открыть ссылку') + '</a>'; }).join('');
  var d = new Date(it.t * 1000);
  return '<div class="view read"><div class="meta">' + esc(RUB[it.r] || '') + ' · ' + d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}) + '</div>' +
    '<h2>' + esc(title(it)) + '</h2><div class="tx">' + body + '</div>' + (btns ? '<div style="margin-top:18px">' + btns + '</div>' : '') +
    (media && !zoom ? '<div class="note">К этому посту есть ' + (it.d > 0 ? 'запись' : 'фото или файл') + ', её можно посмотреть в канале клуба в Telegram, когда он заработает: <a href="' + esc(it.url) + '" target="_blank" rel="noopener">открыть пост</a>.</div>' : '') +
    '</div>';
}

app.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open) return open(b.dataset.open);
  if (b.dataset.rub) return go({rub: b.dataset.rub});
  if (b.dataset.type) return go({media: b.dataset.type});
  var st = stack[stack.length - 1];
  if (b.dataset.chip != null && st) { st.type = b.dataset.chip; st.limit = 0; haptic(); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (b.dataset.lim) {
    var y2 = window.scrollY;
    if (st) { st.limit = +b.dataset.lim; render(); window.scrollTo(0, y2); }
    else { b.outerHTML = ''; }
  }
});

// ── состояния ──
function state(pic, h, p, btn, act){
  app.innerHTML = '<div class="state view"><div class="frame"><img src="/club/img/' + pic + '.jpg" alt=""></div><div class="orn">◆ ◆ ◆</div><h1>' + h + '</h1><p>' + p + '</p>' +
    (btn ? '<button class="btn" id="act">' + btn + '</button>' : '') + '</div>';
  if (btn) document.getElementById('act').onclick = act;
}
function toBot(start){
  var u = BOT + (start ? '?start=' + start : '');
  if (tg && tg.openTelegramLink && tg.initData) { tg.openTelegramLink(u); } else location.href = u;
}

function loginForm(err){
  app.innerHTML = '<div class="state view"><div class="frame"><img src="/club/img/art_vermeer.jpg" alt=""></div><div class="orn">◆ ◆ ◆</div><h1>Материалы<br>клуба</h1>' +
    '<p>Войдите по логину и паролю, которые прислала команда клуба.</p>' +
    '<form class="lf" id="lf" autocomplete="on"><input name="username" id="lg" placeholder="Логин" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">' +
    '<input name="password" id="pw" type="password" placeholder="Пароль" autocapitalize="none" autocomplete="current-password">' +
    '<div class="err" id="er">' + esc(err) + '</div><button class="btn" type="submit" id="go">Войти</button></form>' +
    '<button class="alt" id="viatg">У меня работает Telegram</button></div>';
  document.getElementById('viatg').onclick = function(){ toBot(''); };
  document.getElementById('lf').onsubmit = function(e){
    e.preventDefault();
    var lg = document.getElementById('lg').value.trim(), pw = document.getElementById('pw').value.trim(), er = document.getElementById('er'), go = document.getElementById('go');
    if (!lg || !pw) { er.textContent = 'Введите логин и пароль.'; return; }
    go.disabled = true; er.textContent = '';
    fetch(LOGIN_API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({login: lg, password: pw})})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return {s: r.status, d: d}; }); })
      .then(function(x){
        go.disabled = false;
        if (x.s === 200 && x.d.token) { tokSet(x.d.token); load(); return; }
        er.textContent = x.s === 403 ? 'Резидентство закончилось, доступ закрыт.' : x.s === 429 ? 'Слишком много попыток. Попробуйте через 15 минут.' : 'Неверный логин или пароль.';
      })
      .catch(function(){ go.disabled = false; er.textContent = 'Нет связи. Проверьте интернет и попробуйте ещё раз.'; });
  };
}

function load(){
  var init = tg && tg.initData;
  var demo = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:';
  var tok = !init && tokGet();
  if (!init && !demo && !tok) return loginForm('');
  SITE = !!tok;
  app.innerHTML = '<div class="state"><div class="orn pulse">◆ ◆ ◆</div></div>';
  var req = init ? fetch(API, {headers: {'X-Init-Data': init}}) : tok ? fetch(API, {headers: {'X-Site-Token': tok}}) : fetch('demo.json');
  req.then(function(r){
    if (tok && r.status === 401) { tokSet(''); loginForm(''); return; }
    if (tok && r.status === 403) { tokSet(''); state('art_madamex', 'Доступ<br>закончился', 'Материалы открыты резидентам клуба. Продлите участие, и мы пришлём новый логин и пароль.', 'Продлить участие', function(){ toBot('club'); }); return; }
    if (r.status === 403) { state('art_madamex', 'Доступ<br>для резидентов', 'Материалы открыты участницам клуба. Продлите участие, и всё снова будет здесь.', 'Продлить участие', function(){ toBot('club'); }); return; }
    if (!r.ok) throw new Error(r.status);
    return r.json().then(function(d){
      D = d; RUB = d.rubrics || {};
      D.items.sort(function(a, b){ return b.t - a.t; });
      lectures(D.items);
      adopt(D.items);
      // Разборы (и рубрика «Ваш гардероб») в материалы не выводим
      pics(D.items);
      D.items = D.items.filter(function(i){ return !i.drop && (i.k === 'лекция' || i.k !== 'разбор' && i.r !== 'garderob' && !/разбор/i.test(i.h + ' ' + i.s + ' ' + (i.tags || []).join(' '))); });
      render();
    });
  }).catch(function(){
    state('art_monet', 'Не загрузилось', 'Проверьте интернет и попробуйте ещё раз.', 'Повторить', load);
  });
}

// Основной стиль «Vogue»; прежний «Ар-деко» по ?v=1
var V2 = !(/(^|[?&])v=(1|deco)/.test(location.search) || !!(tg && tg.initDataUnsafe && /deco|^1$/.test(tg.initDataUnsafe.start_param || '')));
if (V2) { document.body.classList.add('v2'); document.documentElement.style.background = '#fff'; }
if (tg) {
  try {
    tg.ready(); tg.expand();
    var bg = V2 ? '#ffffff' : '#0b0b0c';
    tg.setHeaderColor(bg); tg.setBackgroundColor(bg);
    if (tg.setBottomBarColor) tg.setBottomBarColor(bg);
    tg.BackButton.onClick(back);
  } catch(e){}
}
load();
})();
</script>
</body>
</html>
