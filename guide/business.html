<html lang="ru">
<head>

<title>Система имиджа для бизнеса · Mila Ushakova</title>
<style>
  @font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:200 300;font-display:swap;src:url(../fonts/cormorant-italic-light.woff) format('woff')}
  @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:200 300;font-display:swap;src:url(../fonts/cormorant-normal-light.woff) format('woff')}
:root{--deep:#0D1A1E;--pale:#f2edf0;--sand:#f5f0ea;--gold:#c9a96e;--gold2:#b8903a;--goldm:rgba(201,169,110,.55);--f:"PT Serif",Georgia,serif;--c:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--deep)}
body{font-family:var(--f);color:var(--pale);min-height:100svh}
.app{max-width:480px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--goldm)}
.top a{color:var(--gold);text-decoration:none;letter-spacing:.12em}
.view{flex:1;padding:8px 22px 30px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

/* обложка */
.cov{position:relative;min-height:calc(100svh - 50px);display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 92px;margin:0 -22px;overflow:hidden}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,26,30,.15) 0%,rgba(13,26,30,.35) 45%,rgba(13,26,30,.94) 82%)}
.cov .in{position:relative;z-index:1;padding:0 26px}
.kick{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.h1{font-family:var(--c);font-weight:300;font-size:50px;line-height:.98;margin:12px 0 0;color:#fff}
.h1 i{color:var(--gold)}
.chain{margin-top:20px;font-family:var(--c);font-style:italic;font-size:21px;line-height:1.45;color:rgba(242,237,240,.88)}
.chain b{font-weight:300;color:var(--gold);font-style:normal}
.lead{margin-top:16px;font-size:13px;line-height:1.75;color:rgba(242,237,240,.72)}
.cta{display:block;width:100%;margin-top:26px;background:var(--gold);color:var(--deep);text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:16px;font-weight:700}
.sex{display:flex;gap:8px;margin-top:16px}
.sex button{flex:1;text-align:center;border:.5px solid var(--goldm);padding:10px;font-size:12px;color:rgba(242,237,240,.8)}
.sex button.on{background:rgba(201,169,110,.16);border-color:var(--gold);color:#fff}

/* шаги */
.steps{display:flex;gap:6px;margin:6px 0 22px}
.steps span{flex:1;height:2px;background:rgba(201,169,110,.22)}
.steps span.on{background:var(--gold)}
.q{font-family:var(--c);font-weight:300;font-size:36px;line-height:1.05;color:#fff;margin:8px 0 6px}
.hint{font-size:12px;font-style:italic;color:rgba(201,169,110,.75);margin-bottom:20px}
.env{margin-top:6px}
.env h3{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:400;margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:.5px solid rgba(201,169,110,.4);border-radius:30px;padding:9px 14px;font-size:13px;color:rgba(242,237,240,.88);line-height:1.2}
.chip:active,.chip.on{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.goal{border:.5px solid rgba(201,169,110,.35);padding:16px 14px 14px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
.goal:active{background:rgba(201,169,110,.14)}
.goal small{font-size:9px;color:var(--goldm);letter-spacing:.1em}
.goal b{font-family:var(--c);font-weight:300;font-size:22px;line-height:1.08;color:#fff;margin-top:8px}
.back{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pick span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:.5px solid var(--goldm);color:var(--gold);padding:4px 9px;border-radius:20px}

/* вкладки среды */
.tabs{display:flex;gap:0;margin:4px -22px 18px;padding:0 22px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid rgba(201,169,110,.25)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:12px 14px 11px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,240,.55);border-bottom:2px solid transparent;margin-bottom:-.5px}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
.list .ev{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 0;border-bottom:.3px solid rgba(201,169,110,.2);font-size:16px;color:rgba(242,237,240,.9)}
.list .ev:after{content:"→";color:var(--gold)}
/* образы */
.note{font-family:var(--c);font-style:italic;font-weight:300;font-size:21px;line-height:1.4;color:var(--deep);margin-bottom:18px}
.looks{display:flex;gap:12px;overflow-x:auto;margin:0 -22px;padding:0 22px 6px;scroll-snap-type:x mandatory;scroll-padding-left:22px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.lk{flex:0 0 78%;scroll-snap-align:start}
.lk .im{height:330px;background:repeating-linear-gradient(45deg,#e9e4dc 0 10px,#f1ede6 10px 20px);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#9a8f80}
.lk .im img{width:100%;height:100%;object-fit:cover;display:block}
.lk .it{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lk .it a,.lk .it span{font-size:11px;border:.5px solid rgba(13,26,30,.3);padding:5px 10px;border-radius:20px;color:var(--deep);text-decoration:none}
/* результат */
.res{background:var(--sand);color:var(--deep);margin:16px -22px 0;padding:28px 22px 30px}
.res .kick{color:var(--gold2)}
.res h2{font-family:var(--c);font-weight:300;font-size:34px;line-height:1.05;margin:10px 0 18px}
.row{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-top:.3px solid rgba(201,169,110,.45);font-size:13px;line-height:1.65}
.row b{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);font-weight:400;padding-top:3px}
.ph{background:rgba(201,169,110,.16);outline:1px dashed var(--gold);padding:1px 6px;font-style:italic;color:#7a6a4a}
.again{display:flex;gap:8px;margin-top:20px}
.again button{flex:1;text-align:center;border:.5px solid var(--deep);padding:12px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.again button.dk{background:var(--deep);color:var(--pale)}
/* навигация как в Системе: док внизу, меню-шторка, хлебные крошки */
.dock{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:stretch;
  background:rgba(13,26,30,.94);border:.5px solid rgba(201,169,110,.5);border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden;transition:transform .28s ease,opacity .28s ease}
.dock.hide{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none}
.dock button,.dock a{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:7px;height:46px;padding:0 15px;cursor:pointer;
  font-family:var(--f);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,237,240,.9)}
.dock > * + *{border-left:.5px solid rgba(201,169,110,.28)}
.dock .ic{color:var(--gold);font-size:14px;letter-spacing:0}
.dock .d-back.off,.dock .d-sys.off{display:none}
.dock .d-sup{padding:0 13px;color:var(--deep);background:var(--gold)}
.dock button:active,.dock a:active{background:rgba(201,169,110,.18)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px}
.crumbs button{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:.5px solid var(--goldm);color:var(--gold);padding:5px 10px;border-radius:20px}
.crumbs button:active{background:rgba(201,169,110,.18)}
.crumbs i{color:var(--goldm);font-style:normal;font-size:11px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:480px;margin:0 auto;max-height:84svh;overflow-y:auto;background:var(--deep);
  border-top:.5px solid var(--goldm);border-radius:18px 18px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s ease}
.menu-on .sheet-bg{opacity:1;pointer-events:auto}.menu-on .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:rgba(201,169,110,.4);margin:0 auto 16px}
.sheet .row2{display:flex;gap:8px;margin-bottom:6px}
.sheet .row2 button{flex:1;text-align:center;border:.5px solid var(--goldm);padding:11px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,237,240,.85)}
.sheet .row2 button.on{background:rgba(201,169,110,.16);border-color:var(--gold);color:#fff}
.sheet h3{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:400;margin:20px 0 4px}
.sheet .ev{display:flex;justify-content:space-between;width:100%;padding:11px 0;border-bottom:.3px solid rgba(201,169,110,.16);font-size:14px;color:rgba(242,237,240,.88)}
.sheet .ev.cur{color:var(--gold)}
.sheet .ev:after{content:"→";color:var(--goldm)}
#legal{padding-bottom:90px !important;padding:22px 16px 26px;text-align:center;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.7;color:#E8E2D6;opacity:.6}
#legal a{color:inherit;text-decoration:underline;margin:0 9px;white-space:nowrap}
</style>

<div class="app">

<script>
(function(){
// Шаг 1: среда и ситуация
var ENV = [
  {n:'Работа', s:['Офис','Zoom','Встреча с руководством','Встреча с командой','Собеседование','Первый рабочий день','Новая должность, повышение','Casual Friday']},
  {n:'Бизнес', s:['Переговоры','Встреча с клиентом или партнёром','Презентация, питч','Публичное выступление, конференция','Networking']},
  {n:'Вне офиса', s:['Деловой завтрак','Деловой обед','Деловой ужин','Командировка','Культурное или светское событие']},
  {n:'Вечер', s:['Корпоратив','Cocktail','Торжественный деловой вечер','Gala, Black Tie','Неформальный вечер с коллегами и партнёрами']}
];
// Шаг 2: цель
var GOALS = ['Убедить','Вызвать доверие','Расположить','Показать статус','Заявить о себе','Запомниться','Создать дистанцию','Открыть диалог','Объединить','Вдохновить','Показать современность'];

// Шаг 3: что надеть. Сюда Мила вписывает решения: ключ «ситуация|цель» или только «цель».
// Формат: LOOKS['Вызвать доверие'] = {w:{note:'…', looks:[{img:'business/…jpg', items:[{t:'Кардиган', url:'https://…'}]}]}, m:{…}}
var LOOKS = {};

var st = {sex: null, sit: null, env: null, goal: null};
try { st.sex = localStorage.getItem('img_sex'); } catch(e){}
var v = document.getElementById('v');
// Открыли из Системы: показываем дорогу назад
var fromSys = /[?&]from=system/.test(location.search) || /\/guide\/?(gaidosen)?(\?|#|$)/.test(document.referrer);
try { if (fromSys) sessionStorage.setItem('img_from_sys', '1'); else fromSys = sessionStorage.getItem('img_from_sys') === '1'; } catch(e){}
if (fromSys) { document.getElementById('sys').style.display = ''; document.getElementById('dSys').classList.remove('off'); }

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function steps(n){ return '<div class="steps">' + [1,2,3].map(function(i){ return '<span' + (i <= n ? ' class="on"' : '') + '></span>'; }).join('') + '</div>'; }
function show(html){ v.innerHTML = '<div class="view">' + html + '</div>'; window.scrollTo(0, 0); }

function crumbs(n){
  return '<div class="crumbs"><button data-tab="' + st.env + '">' + esc(ENV[st.env].n) + '</button><i>›</i><button data-tab="' + st.env + '">' + esc(st.sit) + '</button>' +
    (n === 3 ? '<i>›</i><button data-go="2">' + esc(st.goal) + '</button>' : '') + '</div>';
}
function cover(){
  show('<div class="cov"><img src="/guide/business-img/cover.jpg" alt="" fetchpriority="high"><div class="in">' +
    '<div class="kick">Для бизнеса · для мужчин и женщин</div>' +
    '<div class="h1">Система<br><i>имиджа</i></div>' +
    '<div class="chain">Куда я иду <b>→</b><br>какое впечатление хочу создать <b>→</b><br>что надеть</div>' +
    '<div class="lead">Инструмент управления впечатлением в профессиональной и деловой среде. Три шага перед любой встречей.</div>' +
    '<div class="sex"><button data-sex="w"' + (st.sex === 'w' ? ' class="on"' : '') + '>Для женщин</button><button data-sex="m"' + (st.sex === 'm' ? ' class="on"' : '') + '>Для мужчин</button></div>' +
    '<button class="cta" data-go="1">Начать</button></div></div>');
}
function step1(){
  var t = st.env || 0;
  show(steps(1) + '<div class="kick">Шаг 1 · Событие</div><div class="q">Куда я иду?</div><div class="hint">Сначала определяется среда</div>' +
    '<div class="tabs">' + ENV.map(function(e, i){ return '<button class="tab' + (i === t ? ' on' : '') + '" data-tab="' + i + '">' + e.n + '</button>'; }).join('') + '</div>' +
    '<div class="list">' + ENV[t].s.map(function(s){ return '<button class="ev" data-sit="' + esc(s) + '" data-env="' + t + '">' + esc(s) + '</button>'; }).join('') + '</div>');
}
function step2(){
  show(steps(2) + crumbs(2) + '<div class="kick">Шаг 2 · Цель</div><div class="q">Чего я хочу добиться?</div><div class="hint">Одна встреча, одна цель, один образ</div>' +
    '<div class="goals">' + GOALS.map(function(g, i){ return '<button class="goal" data-goal="' + esc(g) + '"><small>' + (i < 9 ? '0' : '') + (i + 1) + '</small><b>' + esc(g) + '</b></button>'; }).join('') + '</div>');
}
function step3(){
  var L = LOOKS[st.sit + '|' + st.goal] || LOOKS[st.goal] || {};
  var x = L[st.sex || 'w'] || {};
  var looks = (x.looks && x.looks.length) ? x.looks : [{}, {}, {}];
  show(steps(3) + crumbs(3) +
    '<div class="res"><div class="kick">Шаг 3 · Образы · ' + (st.sex === 'm' ? 'для мужчин' : 'для женщин') + '</div><h2>' + esc(st.goal) + '</h2>' +
    '<div class="note">' + (x.note ? esc(x.note) : '<span class="ph">Принцип образа: например, вязаный кардиган, приглушённые оттенки, мягкая обувь</span>') + '</div>' +
    '<div class="looks">' + looks.map(function(l, i){
      return '<div class="lk"><div class="im">' + (l.img ? '<img loading="lazy" src="' + esc(l.img) + '" alt="">' : 'образ ' + (i + 1)) + '</div><div class="it">' +
        (l.items || []).map(function(it){ return it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.t) + '</a>' : '<span>' + esc(it.t) + '</span>'; }).join('') + '</div></div>';
    }).join('') + '</div>' +
    '<div class="again"><button data-go="2">Другая цель</button><button class="dk" data-go="1">Новое событие</button></div></div>');
}

// Каждый шаг в истории браузера: работают «Назад» в доке, жест назад на телефоне и кнопка браузера
var VIEWS = {cover: cover, s1: step1, s2: step2, s3: step3};
function draw(){ (VIEWS[st.view] || cover)(); document.getElementById('dBack').classList.toggle('off', st.view === 'cover'); }
function go(view, patch, replace){
  for (var k in patch) st[k] = patch[k];
  st.view = view;
  var h = {view: st.view, env: st.env, sit: st.sit, goal: st.goal};
  try { replace ? history.replaceState(h, '') : history.pushState(h, ''); } catch(e){}
  closeMenu(); draw();
}
window.addEventListener('popstate', function(e){
  var h = e.state || {view: 'cover'};
  st.view = h.view; st.env = h.env; st.sit = h.sit; st.goal = h.goal;
  closeMenu(); draw();
});
document.getElementById('dBack').addEventListener('click', function(){
  if (history.state && history.state.view !== 'cover' && history.length > 1) history.back();
  else go(st.view === 's3' ? 's2' : st.view === 's2' ? 's1' : 'cover', {}, true);
});

// Меню-шторка: обложка, для кого, все события сразу
var sheet = document.getElementById('sheet');
function openMenu(){
  sheet.innerHTML = '<div class="grab"></div><div class="row2"><button data-go="cover">На обложку</button>' + (fromSys ? '<button data-sys="1">В Систему ✦</button>' : '') + '</div>' +
    '<div class="row2"><button data-sex="w"' + (st.sex !== 'm' ? ' class="on"' : '') + '>Для женщин</button><button data-sex="m"' + (st.sex === 'm' ? ' class="on"' : '') + '>Для мужчин</button></div>' +
    ENV.map(function(e, i){ return '<h3>' + e.n + '</h3>' + e.s.map(function(x){
      return '<button class="ev' + (x === st.sit ? ' cur' : '') + '" data-sit="' + esc(x) + '" data-env="' + i + '">' + esc(x) + '</button>'; }).join(''); }).join('');
  document.body.classList.add('menu-on');
}
function closeMenu(){ document.body.classList.remove('menu-on'); }
document.getElementById('dMenu').addEventListener('click', function(){ document.body.classList.contains('menu-on') ? closeMenu() : openMenu(); });
document.getElementById('sheetBg').addEventListener('click', closeMenu);

function onTap(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sys) { location.href = '/guide'; return; }
  if (b.dataset.sex) { st.sex = b.dataset.sex; try { localStorage.setItem('img_sex', st.sex); } catch(e){}
    if (document.body.classList.contains('menu-on')) { openMenu(); draw(); } else cover(); return; }
  if (b.dataset.tab) return go('s1', {env: +b.dataset.tab});
  if (b.dataset.sit) return go('s2', {sit: b.dataset.sit, env: +b.dataset.env});
  if (b.dataset.goal) return go('s3', {goal: b.dataset.goal});
  if (b.dataset.go === 'cover') return go('cover', {});
  if (b.dataset.go === '1') return go('s1', {});
  if (b.dataset.go === '2') return go('s2', {});
}
v.addEventListener('click', onTap);
sheet.addEventListener('click', onTap);
