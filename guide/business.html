<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<base href="/guide/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Система имиджа">
<link rel="apple-touch-icon" href="/guide/apple-icon.png">
<title>Система имиджа для бизнеса · Mila Ushakova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* 21.10: чёрный, белый, золото; заголовки узкими заглавными (Oswald), как чёрно-белый манифест Saint Laurent.
   Продукт и визуал передают четыре качества: интеллект, точность, влияние, культурная насмотренность. */
:root{
  --paper:#F4F2EE;--paper2:#E8E5DF;--ink:#111111;--ink2:#2B2B2B;--mute:#7E7B76;
  --bronze:#B08F57;--bronze2:rgba(176,143,87,.55);--rule:rgba(17,17,17,.12);--rule-d:rgba(244,242,238,.16);
  --serif:'Oswald','Arial Narrow',sans-serif;--sans:'Jost',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"lnum" 1}
.app{max-width:520px;margin:0 auto;min-height:100svh;background:var(--paper);position:relative}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
.cap{font-family:var(--sans);font-size:10px;font-weight:400;letter-spacing:.28em;text-transform:uppercase}
.mute{color:var(--mute)}
.br{color:var(--bronze)}

/* верхняя плашка */
.top{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 30px;background:rgba(244,242,238,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .logo{font-family:var(--serif);font-size:16px;letter-spacing:.02em;white-space:nowrap}
.top .logo i{color:var(--bronze)}
.top .ed{font-size:9px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
.top a.sys{font-size:9px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);text-decoration:none}
body.dark-top .top{background:var(--ink);border-bottom-color:var(--rule-d);color:var(--paper)}
body.dark-top .top .ed{color:rgba(244,242,238,.6)}

.view{animation:in .4s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.pad{padding:34px 30px 44px}

/* обложка */
.cov{position:relative;min-height:calc(100svh - 52px);background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:grayscale(1) contrast(1.02) brightness(.8)}
.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,17,0) 22%,rgba(17,17,17,.55) 52%,rgba(17,17,17,.97) 80%)}
.cov .in{position:relative;z-index:1;padding:0 30px 96px}
.cov .ed2{display:flex;justify-content:space-between;border-top:1px solid rgba(244,242,238,.3);padding-top:12px;margin-bottom:26px;color:rgba(244,242,238,.7)}
.cov h1{font-family:var(--serif);font-weight:300;font-size:68px;line-height:.92;letter-spacing:-.01em}
.cov h1 i{color:#C9A96A;font-weight:300}
.cov img.col{filter:none;height:calc(100% - 290px);object-position:60% 90%;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.cov.plain{justify-content:center}
.cov.plain .in{padding-top:40px}
.cov.plain .sub{margin-top:0;font-family:var(--serif);font-size:24px;line-height:1.3;color:var(--paper)}
.cov > .in > .cta:first-of-type{margin-top:30px}
.au p{font-size:14px;line-height:1.7;color:var(--ink2);font-weight:300;margin:0 0 12px}
.au .au-ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;margin:18px 0 22px;filter:none}
.au .au-role{margin:0 0 18px}
.au .cta{margin-top:26px}
.pad.au{padding-bottom:26px}
.cov .sub{margin-top:18px;font-size:14px;line-height:1.65;color:rgba(244,242,238,.78);font-weight:300;max-width:360px}
.toc{margin-top:26px;border-top:1px solid rgba(244,242,238,.22)}
.toc div{display:grid;grid-template-columns:44px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(244,242,238,.22)}
.toc span{font-family:var(--serif);font-style:italic;color:#C9A96A;font-size:15px}
.toc b{font-family:var(--serif);font-weight:300;font-size:23px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:24px;border:1px solid rgba(244,242,238,.35)}
.seg button{text-align:center;padding:12px 6px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,242,238,.75)}
.seg button + button{border-left:1px solid rgba(244,242,238,.35)}
.seg button.on{background:var(--paper);color:var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;background:var(--paper);color:var(--ink);padding:18px 20px;font-size:11px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;text-decoration:none}
.cta:after{content:"→";font-size:16px;letter-spacing:0}
.cta.dk{background:var(--ink);color:var(--paper)}
.cta.br{background:var(--bronze);color:#fff}
.ghost{display:block;width:100%;text-align:center !important;margin-top:16px;font-size:10px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:rgba(244,242,238,.75);padding:6px}
.ghost u{text-decoration:none;border-bottom:1px solid var(--bronze2);padding-bottom:3px}
.ghost.lt{color:var(--ink2)}

/* шаги */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.prog span{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--mute)}
.prog span.on{color:var(--ink)}
.prog i{flex:1;height:1px;background:var(--rule)}
.prog i.on{background:var(--ink)}
.h2{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1.02;letter-spacing:-.01em;margin:10px 0 8px}
.h2 i{color:var(--bronze)}
.lede{font-size:13.5px;line-height:1.65;color:var(--mute);font-weight:300;max-width:380px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:22px}
.crumbs button{font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--bronze2);padding-bottom:2px}
.crumbs i{font-style:normal;color:var(--bronze)}

/* среда: римские цифры как разделы отчёта */
.envs{display:grid;grid-template-columns:repeat(4,1fr);margin:24px -22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.envs button{padding:14px 4px 12px;text-align:center !important;border-left:1px solid var(--rule);position:relative}
.envs button:first-child{border-left:0}
.envs b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:18px;color:var(--mute)}
.envs span{display:block;margin-top:4px;font-size:9.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.envs button.on{background:var(--ink)}
.envs button.on b{color:#C9A96A}.envs button.on span{color:var(--paper)}
.events{margin-top:6px}
.ev{display:grid;grid-template-columns:46px 1fr 18px;align-items:center;width:100%;padding:17px 0;border-bottom:1px solid var(--rule)}
.ev small{font-size:11px;color:var(--bronze);font-weight:500}
.ev b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.2}
.ev:after{content:"→";color:var(--ink2);font-size:15px}
.ev:active{background:var(--paper2)}

/* цели: типографский список */
.goals{margin-top:20px;border-top:1px solid var(--ink)}
.goal{display:grid;grid-template-columns:46px 1fr auto;align-items:baseline;width:100%;padding:15px 0 14px;border-bottom:1px solid var(--rule)}
.goal small{font-size:11px;color:var(--bronze);font-weight:500}
.goal b{font-family:var(--serif);font-weight:300;font-size:28px;line-height:1.1}
.goal em{font-style:normal;font-size:9.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.goal:active{background:var(--paper2)}

/* бриф и образы */
.brief{background:var(--ink);color:var(--paper);margin:0 -30px;padding:30px 30px 32px}
.brief .cap{color:#C9A96A}
.brief h2{font-family:var(--serif);font-weight:300;font-size:44px;line-height:1.02;margin:12px 0 18px}
.brief dl{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--rule-d)}
.brief dt,.brief dd{padding:11px 0;border-bottom:1px solid var(--rule-d);font-size:13px}
.brief dt{font-size:9.5px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,242,238,.55);padding-top:13px}
.principle{margin:30px 0 22px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:26px;line-height:1.38;color:var(--ink2)}
.looks{display:flex;gap:14px;overflow-x:auto;margin:0 -30px;padding:0 30px 8px;scroll-snap-type:x mandatory;scroll-padding-left:22px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.lk{flex:0 0 74%;scroll-snap-align:start}
.lk .im{position:relative;aspect-ratio:3/4;background:var(--paper2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.lk .im img{width:100%;height:100%;object-fit:cover;display:block}
.lk .im .n{position:absolute;left:12px;top:10px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2)}
.lk .im .ph{font-size:9.5px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.lk ul{list-style:none;margin-top:10px;border-top:1px solid var(--rule)}
.lk li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
.lk li a{text-decoration:none;border-bottom:1px solid var(--bronze2)}
.ph{background:rgba(156,123,79,.12);outline:1px dashed var(--bronze);padding:1px 6px;font-style:italic;color:#6f5a3a}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.pair button{text-align:center !important;padding:15px 6px;font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.pair button.dk{color:var(--bronze)}

/* тарифы: как прайс частного банка */
.tf-head{background:var(--ink);color:var(--paper);margin:0 -30px;padding:36px 30px 36px}
.tf-head .h2 i{color:#C9A96A}
.tf-head .lede{color:rgba(244,242,238,.65)}
.tf{padding:24px 0 22px;border-bottom:1px solid var(--rule)}
.tf .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tf .nm{font-size:12px;font-weight:400;letter-spacing:.34em}
.tf .who{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:right}
.tf .pr{font-family:var(--serif);font-weight:300;font-size:50px;line-height:1;margin:14px 0 2px;letter-spacing:-.01em}
.tf .pr small{font-family:var(--sans);font-size:11px;color:var(--mute);letter-spacing:.04em;margin-left:8px;font-weight:400}
.tf ul{list-style:none;margin-top:12px}
.tf li{font-size:13.5px;line-height:1.55;padding:4px 0 4px 18px;position:relative;color:var(--ink2)}
.tf li:before{content:"";position:absolute;left:0;top:13px;width:9px;height:1px;background:var(--bronze)}
.tf .pick{display:inline-flex;gap:10px;align-items:center;margin-top:14px;font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:4px}
.tf.hi{position:relative}
.tf.hi .badge{display:block;margin-bottom:10px;color:var(--bronze);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase}
.tf.hi .pick{border-bottom-color:var(--bronze);color:var(--ink)}
.note{margin-top:30px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:22px;line-height:1.45;color:var(--ink2)}

/* док и шторка */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding-bottom:env(safe-area-inset-bottom);z-index:50;display:flex;align-items:stretch;
  background:var(--ink);color:var(--paper);border-radius:0;border-top:1px solid rgba(244,242,238,.12);overflow:hidden;transition:transform .3s ease,opacity .3s ease}
.dock.hide{transform:translate(-50%,calc(100% + 2px));opacity:0;pointer-events:none}
.dock button,.dock a{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;cursor:pointer;
  font-family:var(--sans);font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.dock > * + *{border-left:1px solid rgba(244,242,238,.14)}
.dock .ic{color:#C9A96A;font-size:13px;letter-spacing:0}
.dock .off{display:none !important}
.dock .d-docs{flex:0 0 auto;padding:0 16px;color:#C9A96A}
.view{padding-bottom:calc(49px + env(safe-area-inset-bottom))}
.sheet .docs{display:grid;gap:0;margin-top:6px}
.sheet .docs a{display:block;padding:16px 0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:20px;color:var(--ink);text-decoration:none}
.dock .d-sup{padding:0 18px;color:#C9A96A;flex:0 0 auto}
.dock button{flex:1 1 0;justify-content:center;padding:0 8px}
.dock button:active,.dock a:active{background:#262626}
.sheet-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:86svh;overflow-y:auto;background:var(--paper);
  padding:14px 30px calc(30px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.menu-on .sheet-bg{opacity:1;pointer-events:auto}.menu-on .sheet{transform:none}
.sheet .grab{width:36px;height:3px;background:var(--rule);margin:0 auto 18px}
.sheet .quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .quick button{text-align:center !important;border:1px solid var(--ink);padding:12px 6px;font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase}
.sheet .quick button.on{background:var(--ink);color:var(--paper)}
.sheet h3{display:flex;justify-content:space-between;margin:24px 0 2px;font-size:10px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:var(--bronze)}
.sheet h3 i{font-family:var(--serif);font-size:13px;letter-spacing:0;text-transform:none}
.sheet .ev{padding:12px 0;grid-template-columns:40px 1fr 18px}
.sheet .ev b{font-size:16px}
.sheet .ev.cur b{color:var(--bronze)}

#legal{display:none;padding:18px 16px calc(66px + env(safe-area-inset-bottom));text-align:center;font-size:11px;line-height:1.8;color:var(--mute);background:var(--paper);border-top:1px solid var(--rule)}
#legal a{color:inherit;margin:0 9px;white-space:nowrap}
/* узкие заглавные вместо антиквы: курсив убран, акцент цветом */
.top .logo{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase}
.cov h1,.h2,.brief h2,.toc b,.ev b,.goal b,.tf .pr,.sol h2{font-weight:400;text-transform:uppercase;letter-spacing:.005em}
.cov h1{font-size:76px;line-height:.9}
.h2{font-size:52px;line-height:.95}
.h2 i,.cov h1 i,.tf-head .h2 i{font-style:normal}
.toc span,.prog span,.envs b,.lk .im .n,.sheet h3 i{font-style:normal;font-family:var(--serif)}
.toc b{font-size:22px;font-weight:300}
.cov.plain .sub,.principle,.note{font-family:var(--sans);font-style:normal;font-weight:300}
.cov.plain .sub{font-size:18px;line-height:1.5}
.principle{font-size:18px;line-height:1.6}
.note{font-size:17px;line-height:1.6}
.sheet .docs a{font-family:var(--sans);font-size:15px;letter-spacing:.04em}
.ev b{font-size:20px;font-weight:300}
.goal b{font-size:24px;font-weight:300}
.tf .pr{font-size:44px;font-weight:300}
.brief h2{font-size:40px}
/* шаг: номер и пейджер */
.stp{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stp .n{font-family:var(--serif);font-size:15px;color:var(--bronze);letter-spacing:.08em}
.pager{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;margin-top:30px}
.pager button{width:52px;height:52px;border:1px solid var(--ink);border-radius:50%;text-align:center !important;font-size:18px}
.pager button:disabled{opacity:.25;cursor:default}
.pager span{text-align:center;font-family:var(--serif);font-size:14px;letter-spacing:.14em;color:var(--mute)}
/* события с фото */
.ev.im{grid-template-columns:72px 1fr 18px;gap:0 14px;padding:10px 0}
.ev .th{width:72px;height:72px;object-fit:cover;display:block;filter:grayscale(.15)}
.ev .th.no{display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bronze);font-family:var(--serif);font-size:18px}
.ev.im small{display:none}
/* цели: выбор как радиокнопка */
.goal{grid-template-columns:34px 1fr auto;align-items:center}
.goal small{width:20px;height:20px;border:1px solid var(--bronze);border-radius:50%;font-size:0}
.goal.on{background:var(--ink);color:var(--paper);margin:0 -14px;padding-left:14px;padding-right:14px;width:calc(100% + 28px)}
.goal.on small{border:6px solid var(--bronze)}
/* комментарий эксперта */
.xp{display:grid;grid-template-columns:1fr 46%;gap:18px;align-items:start}
.xp img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;display:block}
.xp .cap{color:var(--bronze);line-height:1.8}
.qt{font-family:Georgia,serif;font-size:64px;line-height:.6;color:var(--bronze);margin:30px 0 6px}
.xp-t{font-size:16px;line-height:1.7;font-weight:300;color:var(--ink2)}
.xp-t p + p{margin-top:14px}
.rules{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--rule)}
.rules li{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule)}
.rules .rn{flex:none;width:26px;font-family:var(--serif);font-size:13px;letter-spacing:1px;color:var(--bronze);padding-top:3px}
.rules b{display:block;font-weight:500;font-size:16px;line-height:1.45;color:var(--ink)}
.rules p{margin:6px 0 0;font-size:15px;line-height:1.65;font-weight:300;color:var(--ink2)}
.sig{display:flex;align-items:center;gap:14px;margin-top:26px}
.sig i{flex:1;height:1px;background:var(--bronze2)}
.sig span{font-family:var(--serif);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze)}
/* решение */
.sol h2{font-family:var(--serif);font-size:48px;line-height:.95;margin:4px 0 18px}
.sol dl{border-top:1px solid var(--rule)}
.sol dt{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);padding-top:12px}
.sol dd{font-size:18px;padding:2px 0 12px;border-bottom:1px solid var(--rule)}
.sol dd.gl{background:var(--ink);color:#C9A96A;padding:10px 14px;margin:6px 0 12px;border:0;font-family:var(--serif);text-transform:uppercase;letter-spacing:.06em}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-bottom:1px solid var(--rule)}
.tabs3 button{text-align:center !important;padding:12px 0;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent}
.tabs3 button.on{color:var(--ink);border-bottom-color:var(--bronze)}
.tab-t{font-size:15px;line-height:1.7;font-weight:300;padding:16px 0 4px;color:var(--ink2)}
/* 21.10: гармония. Шкала шрифта 1.25: 10 · 13 · 16 · 20 · 24 · 32 · 44 · 56; отступы кратны 8. */
.cov:not(.plain){justify-content:flex-start}
.cov:not(.plain):after{display:none}
.cov img.col{position:relative;inset:auto;display:block;width:100%;height:36svh;min-height:280px;object-position:50% 88%;flex:0 0 auto;

// Правила Милы: ключ «ситуация|цель|w|m», [заголовок, пояснение]. Собирается из ~/Desktop/Мила/Система/имидж-тексты (build.py)
/*RULES*/var RULES = {"Офис|Вызвать доверие|w":[["Не повышайте формальность автоматически.","Доверие не равно строгому костюму. Ориентируйтесь на культуру компании: слишком формальный образ может создавать такую же дистанцию, как слишком расслабленный — ощущение неуместности."],["Выбирайте одежду, которая соответствует вашей реальной роли.","Не пытайтесь выглядеть «более руководителем» или «более серьёзным специалистом» за счёт одежды."],["Не старайтесь выглядеть милой.","Задача доверия — не понравиться. Избыточная романтизация, инфантильность или намеренное смягчение образа могут увести восприятие от профессиональной компетентности."],["Не демонстрируйте статус там, где требуется доверие.","Дорогие и узнаваемые вещи допустимы, но демонстрация их стоимости не должна становиться вашим образом. Статус и доверие — разные задачи."],["Следите за тем, куда направлено внимание.","Яркая или необычная вещь сама по себе не мешает доверию, остаётся ли внимание на вас и разговоре с вами"],["Не надевайте вещи, которые приходится контролировать.","Если юбку нужно одёргивать, декольте — проверять, жакет — поправлять, а брюки мешают свободно сесть, одежда вам не подходит"],["Оставьте телу свободу движения.","Вы должны одинаково естественно сидеть, вставать, идти, наклоняться и жестикулировать. Уверенность считывается не только в статичном образе, но и в том, как человек в нём двигается."],["Следите за посадкой, а не за размером на этикетке.","Слишком тесная вещь может создавать ощущение ошибки, даже если формально это ваш размер."],["Контролируйте степень открытости тела.","Дело не в запрете декольте или определённой длины юбки. Важно, чтобы открытость была намеренной и соответствовала среде, а не выглядела случайным следствием движения одежды."],["Учитывайте дистанцию общения.","Парфюм, украшения, часы, очки и другие детали особенно заметны в разговоре один на один."],["Не изображайте «правильную деловую женщину».","Профессиональная среда не требует единой визуальной униформы. Сохраняйте собственный стиль, но соотносите его с контекстом."],["Будьте последовательны.","Доверие это последовательность и будьте идентичны"]],"Офис|Убедить|w":[["Соберите внимание ближе к лицу.","Оправа, серьги, воротник, лацканы, линия горловины работают как обрамление. Во время разговора взгляд собеседника должен возвращаться к вашему лицу."],["Выберите один элемент, который удерживает внимание.","Оправа, украшение, жакет, обувь, принт — акцент может быть любым. Важно, чтобы в образе была понятная визуальная иерархия."],["Уберите визуальную многословность.","Большое количество слоёв, деталей, декора и пересекающихся линий усложняет образ. Когда задача — убедить, визуальная ясность работает в вашу пользу."],["Не путайте убедительность с формальностью.","Костюм сам по себе не делает позицию весомее. Степень формальности выбирайте относительно среды и людей, с которыми предстоит разговор."],["Не демонстрируйте власть, если вам нужно согласие.","Слишком жёсткий образ способен перевести разговор из убеждения в противостояние. Оставьте собеседнику пространство согласиться с вами."],["Оставьте свободу жестам.","Руки участвуют в аргументации. Одежда не должна ограничивать движения, заставлять держать корпус неподвижно или постоянно себя контролировать."],["Учитывайте, кого именно вы убеждаете.","Собственник бизнеса, клиент, команда и совет директоров — разные аудитории. Один и тот же образ не может одинаково точно работать во всех четырёх ситуациях."],["Не отказывайтесь от индивидуальности.","Характерная оправа, украшение, необычная обувь или собственная манера сочетать вещи могут усиливать убедительность, если выглядят естественной частью вас."],["Если вы думаете «не слишком ли это?» — скорее всего, слишком.","Важный разговор — не лучшее место для вещи, которую вам самой приходится внутренне оправдывать."],["Не доказывайте равенство с мужчинами мужским гардеробом.","Жёсткое плечо, широкий лацкан и костюм не являются обязательными атрибутами авторитета. Убедительность женщины может строиться на точности силуэта, качестве материала, масштабе деталей, посадке и ясной визуальной позиции — без имитации мужских кодов власти."]],"Офис|Показать компетентность|w":[["Не повышайте градус серьёзности одеждой.","Строгий костюм не прибавляет знаний. Гораздо убедительнее выглядит женщина, которая точно понимает степень формальности своей профессии и конкретной встречи."],["Покажите, что вы знаете правила.","Даже если собираетесь их нарушить. Необычная обувь, винтажное украшение, цвет или нестандартная пропорция выглядят профессионально, когда понятно: это решение, а не ошибка"],["Не собирайте образ из одних «правильных» вещей.","Жакет + рубашка + брюки + лоферы ещё не сообщают о профессионализме. Иногда такой комплект выглядит скорее как попытка соответствовать представлению о деловом человеке"],["Используйте код своей профессии, а не универсальный офисный код.","Юрист, архитектор, финансист, галерист, fashion-директор и руководитель IT-компании не должны выглядеть одинаково. Понимание визуального языка своей среды само говорит об опыте"],["Качество показывайте вблизи.","На расстоянии вытянутой руки особенно хорошо видны материал жакета, трикотаж, оправа, часы, украшения, фурнитура сумки и обувь. Здесь качество работает убедительнее логотипа."],["Не перегружайте образ доказательствами вкуса.","Сложная стилизация, интеллектуальные бренды, винтаж, необычные аксессуары — всё сразу может производить обратный эффект. Если вы профессионал, вам не нужно демонстрировать весь свой визуальный словарь"],["Оставьте одну деталь, которую можно связать с вами.","Оправа, часы, кольцо, брошь, определённая форма обуви или собственная манера носить жакет"],["Посмотрите, как вы выглядите сидя.","Большая часть офисной коммуникации происходит за столом. В кадре остаётся верхняя половина тела: лицо, плечи, воротник, украшения, руки"],["Проверьте образ без сумки и верхней одежды.","Если весь эффект держался на дорогой сумке или пальто, в переговорной он исчезнет. Рабочий образ должен сохранять убедительность после того, как вы сняли всё внешнее"],["Уберите из образа самую дорогую вещь.","Вы всё ещё выглядите компетентно?"]],"Офис|Показать статус|w":[["Не пытайтесь выглядеть дороже.","Статус может считываться через качество вещей, узнаваемый бренд, редкий объект, прекрасную посадку, масштаб, индивидуальный стиль или свободу обращения с профессиональным дресс-кодом. Единой формулы нет."],["Понимайте, что сообщает узнаваемая вещь.","Логотип, культовая сумка, часы или украшение могут быть точным статусным сигналом. В одной профессиональной среде их прочитают как знание культурного кода, в другой — как финансовый уровень, в третьей они вообще не будут иметь значения. Учитывайте, кто находится перед вами."],["Цена вещей не должна быть единственным содержанием образа.","Можно быть полностью одетой в люкс. Вопрос не в количестве дорогих вещей, а в том, остаются ли за ними видны женщина, её вкус, профессиональная роль и собственный способ выбирать."],["Не объясняйте ценность своих вещей.","Если вещь важна только после того, как собеседник узнал её цену, бренд, редкость или происхождение, подумайте, какую функцию она выполняла до этого объяснения."],["Используйте ювелирные украшения как часть статусного языка.","Ювелирное изделие может сообщать не только о стоимости. Наследственное украшение, современный ювелирный дизайн, узнаваемая коллекция большого дома, редкий винтаж или авторская работа несут разные культурные коды. Важны не количество каратов и известность марки сами по себе, а легенда об украшении."],["Знайте правила достаточно хорошо, чтобы позволить себе их интерпретировать.","Высокий профессиональный статус часто даёт больше свободы в обращении с корпоративным кодом. Но эта свобода убедительна тогда, когда понятно: вы знаете правила и сознательно выбираете степень соответствия им."],["Не путайте статус с формальностью.","Костюм не всегда ставит женщину выше, а трикотаж не делает её менее значимой. Уровень формальности должен соответствовать среде, роли и ситуации. Иногда возможность прийти проще остальных сама говорит о положении человека, если контекст подтверждает это право."],["Не уменьшайте себя перед человеком выше по иерархии.","Встреча с собственником, инвестором или руководителем не требует становиться скромнее, мельче или незаметнее. Уважение к чужому положению не означает визуального отказа от собственного."],["Не маскируйте статус под маскулинность.","Жёсткое плечо, широкий лацкан, мужские часы или обувь могут быть прекрасной частью женского гардероба. Но они не являются обязательными атрибутами власти. Женственность не уменьшает профессиональный вес."],["Не подтверждайте актуальность количеством трендов.","Статусная женщина может прекрасно знать моду и носить самые актуальные вещи. Важнее другое: виден ли за ними собственный выбор или образ целиком определяется текущей повесткой."],["Не бойтесь повторять сильные вещи.","Хорошее пальто, часы, кольцо, сумка, жакет или определённая форма обуви могут появляться снова и снова. В какой-то момент окружающие перестают воспринимать их как отдельные предметы: они становятся частью вашего визуального кода."],["Не создавайте слишком большой разрыв между образом и полномочиями.","Одежда может немного опережать текущую роль — особенно в период профессионального роста. Но образ, который обещает значительно больше власти, доступа или положения, чем подтверждает сама ситуация, может вызвать вопрос вместо нужного впечатления."],["Оставьте себе право на недосказанность.","Не каждая дорогая вещь должна быть узнаваема. Но и узнаваемость не нужно специально скрывать. Вы сами решаете, какие коды сделать очевидными, а какие оставить доступными только тем, кто умеет их читать."]]};/*/RULES*/

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

}

    '<div class="qt">“</div><div class="xp-t">' + (c ? c.split('\n').map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') :
      '<p><span class="ph">Комментарий Милы: «' + esc(st.sit) + '» и цель «' + esc(st.goal) + '». Почему такой образ работает.</span></p>') + '</div>') +
    '<div class="sig"><i></i><span>Мила Ушакова</span></div>' +
    pager(3, true) + '</div>');
}
function step4(){
  var L = LOOKS[st.sit + '|' + st.goal] || LOOKS[st.goal] || {};
  var x = L[st.sex || 'w'] || {};
  var looks = (x.looks && x.looks.length) ? x.looks : [{}, {}, {}];
  var TABS = [['Силуэт', 'sil'], ['Цвет', 'col'], ['Детали', 'det']], tb = TABS[st.tab || 0];
  show('<div class="pad sol">' + stepHead(4) + crumbs(3) +
    '<h2>Ваше <span class="br">решение</span></h2>' +
    '<dl><dt>Сценарий</dt><dd>' + esc(st.sit) + '</dd><dt>Цель</dt><dd class="gl">' + esc(st.goal) + '</dd><dt>Для кого</dt><dd>' + (st.sex === 'm' ? 'Мужчина' : 'Женщина') + '</dd></dl>' +
    '<div class="principle">' + (x.note ? esc(x.note) : '<span class="ph">Принцип образа. Например: вязаный кардиган, приглушённые оттенки, мягкая обувь</span>') + '</div>' +
    '<div class="looks">' + looks.map(function(l, i){
      return '<div class="lk"><div class="im">' + (l.img ? '<img loading="lazy" src="' + esc(l.img) + '" alt="">' : '<span class="ph">образ ' + (i + 1) + '</span>') + '<span class="n">' + nn(i + 1) + '</span></div>' +
        (l.items && l.items.length ? '<ul>' + l.items.map(function(it){ return '<li>' + (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.t) + '</a>' : esc(it.t)) + '<span class="br">↗</span></li>'; }).join('') + '</ul>' : '') + '</div>';
    }).join('') + '</div>' +
    '<div class="tabs3">' + TABS.map(function(t, i){ return '<button data-tabx="' + i + '"' + (i === (st.tab || 0) ? ' class="on"' : '') + '>' + t[0] + '</button>'; }).join('') + '</div>' +
    '<div class="tab-t">' + (x[tb[1]] ? esc(x[tb[1]]) : '<span class="ph">' + tb[0] + ': рекомендация Милы</span>') + '</div>' +
    '<div class="pair"><button data-go="2">Другая цель</button><button class="dk" data-go="1">Новое событие</button></div>' +
    '<button class="ghost lt" data-go="tariffs"><u>Подключить для компании</u></button></div>');
}
function tariffs(){
  show('<div class="pad" style="padding-top:0"><div class="tf-head"><div class="cap" style="color:#C9A96A">Для компаний</div><div class="h2" style="color:var(--paper)">Единый уровень впечатления <i>для всей команды</i></div>' +
    '<div class="lede">Доступ к Системе имиджа для сотрудников и руководителей. Формат подбираем под задачи компании.</div></div>' +
    TARIFFS.map(function(t){ return '<div class="tf' + (t.hi ? ' hi' : '') + '">' + (t.hi ? '<span class="badge">Рекомендуем</span>' : '') +
      '<div class="row"><span class="nm">' + t.n + '</span><span class="who">' + t.who + '</span></div>' +
      '<div class="pr">' + t.p + (t.t ? '<small>· ' + t.t + '</small>' : '') + '</div>' +
      '<ul>' + t.inc.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<a class="pick" href="' + CONTACT + '" target="_blank" rel="noopener">Выбрать ' + t.n + ' <span>→</span></a></div>'; }).join('') +
    '<div class="note">Не уверены, какой формат подойдёт? Напишите, я подберу его под задачи вашей команды.</div>' +
    '<a class="cta dk" href="' + CONTACT + '" target="_blank" rel="noopener">Обсудить подключение</a>' +
    '<button class="ghost lt" data-go="1"><u>Как работает Система</u></button></div>');
}

// История: «Назад» в доке, жест назад и кнопка браузера идут по шагам
var VIEWS = {cover: cover, about: about, intro: intro, s0: step0, s1: step1, s2: step2, s3: step3, s4: step4, tariffs: tariffs};
function draw(){ (VIEWS[st.view] || cover)(); document.body.classList.toggle('on-cover', st.view === 'cover'); document.getElementById('dBack').classList.toggle('off', st.view === 'cover'); document.getElementById('dTar').classList.toggle('off', st.view === 'tariffs'); }
function go(view, patch, replace){
  for (var k in patch) st[k] = patch[k];
  st.view = view;
  var h = {view: st.view, env: st.env, sit: st.sit, goal: st.goal};
  try { replace ? history.replaceState(h, '', view === 'tariffs' ? '#tariffs' : location.pathname + location.search) : history.pushState(h, '', view === 'tariffs' ? '#tariffs' : location.pathname + location.search); } catch(e){}
  closeMenu(); draw();
}
window.addEventListener('popstate', function(e){
  var h = e.state || {view: /tariff/.test(location.hash) ? 'tariffs' : 'cover'};
  st.view = h.view; st.env = h.env || 0; st.sit = h.sit; st.goal = h.goal;
  closeMenu(); draw();
});
document.getElementById('dBack').addEventListener('click', function(){
  if (history.state && history.length > 1 && history.state.view !== 'cover') history.back();
  else go({s4:'s3', s3:'s2', s2:'s1', s1:'intro', s0:'cover', intro:'about'}[st.view] || 'cover', {}, true);
});
document.getElementById('dTar').addEventListener('click', function(){ go('tariffs', {}); });

var sheet = document.getElementById('sheet');
function openMenu(){
  var n = 0; sheet.dataset.k = 'menu';
  sheet.innerHTML = '<div class="grab"></div><div class="quick"><button data-go="cover">Обложка</button><button data-go="about">Об авторе</button><button data-go="intro">О Системе</button><button data-go="tariffs">Тарифы</button>' +
    '<button data-sex="w"' + (st.sex !== 'm' ? ' class="on"' : '') + '>Для женщин</button><button data-sex="m"' + (st.sex === 'm' ? ' class="on"' : '') + '>Для мужчин</button>' +
    (fromSys ? '<button data-sys="1" style="grid-column:1/-1">← В Систему цветовых сочетаний</button>' : '') + '</div>' +
    ENV.map(function(e, i){ return '<h3><span>' + e.n + '</span><i>' + e.r + '</i></h3>' + e.s.map(function(x){ n++;
      return '<button class="ev' + (x === st.sit ? ' cur' : '') + '" data-sit="' + esc(x) + '" data-env="' + i + '"><small>' + nn(n) + '</small><b>' + esc(x) + '</b></button>'; }).join(''); }).join('');
  document.body.classList.add('menu-on');
}
function closeMenu(){ document.body.classList.remove('menu-on'); }
document.getElementById('tMenu').addEventListener('click', function(){ openMenu(); });
document.getElementById('tLogo').addEventListener('click', function(){ go('cover', {}); });
document.getElementById('dMenu').addEventListener('click', function(){ document.body.classList.contains('menu-on') && sheet.dataset.k === 'menu' ? closeMenu() : openMenu(); });
document.getElementById('sheetBg').addEventListener('click', closeMenu);
document.getElementById('dDocs').addEventListener('click', function(){
  if (document.body.classList.contains('menu-on') && sheet.dataset.k === 'docs') return closeMenu();
  sheet.dataset.k = 'docs';
  sheet.innerHTML = '<div class="grab"></div><h3><span>Документы</span><i>ИП Ольхина Я.Ф.</i></h3><div class="docs">' +
    '<a href="/oferta" target="_blank">Договор оферты</a><a href="/privacy" target="_blank">Политика конфиденциальности</a>' +
    '<a href="https://t.me/MilaUshakova_ClubBot?start=support" target="_blank" rel="noopener">Поддержка</a></div>';
  document.body.classList.add('menu-on');
});

function onTap(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sys) { location.href = '/guide'; return; }
  if (b.dataset.sex) { st.sex = b.dataset.sex; try { localStorage.setItem('img_sex', st.sex); } catch(e){}
    if (st.view === 's2' && st.goal && goalsFor(st.sit).indexOf(st.goal) < 0) st.goal = null;
    if (b.dataset.next) return go('s1', {});
    if (document.body.classList.contains('menu-on')) openMenu(); draw(); return; }
  if (b.dataset.tab) return go('s1', {env: +b.dataset.tab});
  if (b.dataset.sit) return go('s2', {sit: b.dataset.sit, env: +b.dataset.env, goal: b.dataset.sit === st.sit ? st.goal : null});
  if (b.dataset.goal) return go('s3', {goal: b.dataset.goal});
  if (b.dataset.tabx) { st.tab = +b.dataset.tabx; var y = window.scrollY; draw(); window.scrollTo(0, y); return; }
  if (b.dataset.go === 'cover') return go('cover', {});
  if (b.dataset.go === 'about') return go('about', {});
  if (b.dataset.go === 'intro') return go('intro', {});
  if (b.dataset.go === 'tariffs') return go('tariffs', {});
  if (b.dataset.go === '1') return go(st.view === 'cover' || st.view === 'intro' || !st.sex ? 's0' : 's1', {});
  if (b.dataset.go === '2') return go(st.sit ? 's2' : 's1', {});
  if (b.dataset.go === '3') return go(st.goal ? 's3' : 's2', {});
  if (b.dataset.go === '4') return go('s4', {tab: 0});
}
v.addEventListener('click', onTap);
sheet.addEventListener('click', onTap);

var lastY = 0, dock = document.getElementById('dock');
window.addEventListener('scroll', function(){ var y = window.scrollY; var end = y + innerHeight > document.documentElement.scrollHeight - 80; dock.classList.toggle('hide', !end && y > lastY + 4 && y > 140); if (Math.abs(y - lastY) > 4) lastY = y; }, {passive: true});

go(/tariff/.test(location.hash) ? 'tariffs' : 'cover', {}, true);
})();
</script>
</body>
