<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<base href="/guide/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Имидж">
<link rel="apple-touch-icon" href="/guide/image-icon-180.png">
<link rel="manifest" href="/guide/image.webmanifest">
<title>Система имиджа · Mila Ushakova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* 21.10: чёрный, белый, золото; заголовки узкими заглавными (Oswald), как чёрно-белый манифест Saint Laurent.
   Продукт и визуал передают четыре качества: интеллект, точность, влияние, культурная насмотренность. */
:root{
  --paper:#F4F2EE;--paper2:#E8E5DF;--ink:#111111;--ink2:#2B2B2B;--mute:#7E7B76;
  --bord:#5A1A22;--bronze:#B08F57;--bronze2:rgba(176,143,87,.55);--rule:rgba(17,17,17,.12);--rule-d:rgba(244,242,238,.16);
  --serif:'Oswald','Arial Narrow',sans-serif;--sans:'Jost',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"lnum" 1}
.app{max-width:520px;margin:0 auto;min-height:100svh;background:var(--paper);position:relative}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
.cap{font-family:var(--sans);font-size:10px;font-weight:400;letter-spacing:.28em;text-transform:uppercase}
.mute{color:var(--mute)}
.br{color:var(--bronze)}

/* верхняя плашка */
.top{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 30px;background:rgba(244,242,238,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .logo{font-family:var(--serif);font-size:16px;letter-spacing:.02em;white-space:nowrap}
.top .logo i{color:var(--bronze)}
.top .ed{font-size:9px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top a.sys{font-size:9px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--bronze);text-decoration:none}
.top-r{display:flex;align-items:center;gap:14px;min-width:0}
.lng{display:flex;align-items:center;gap:6px;flex:none;font-size:10px;letter-spacing:.2em}
.lng button{color:var(--mute);padding:8px 0}
.lng button.on{color:var(--ink)}
.lng i{font-style:normal;color:var(--bronze)}
body.dark-top .top{background:var(--ink);border-bottom-color:var(--rule-d);color:var(--paper)}
body.dark-top .top .ed{color:rgba(244,242,238,.6)}
body.dark-top .lng button,body.on-cover .lng button{color:rgba(244,242,238,.45)}
body.dark-top .lng button.on,body.on-cover .lng button.on{color:var(--paper)}
body.en .cov.sl .row3 button{font-size:14px;letter-spacing:.03em}
body.en .goal b{font-size:18px}

.view{animation:in .4s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.pad{padding:34px 30px 44px}

/* обложка */
.cov{position:relative;min-height:calc(100svh - 52px);background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:grayscale(1) contrast(1.02) brightness(.8)}
.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,17,0) 22%,rgba(17,17,17,.55) 52%,rgba(17,17,17,.97) 80%)}
.cov .in{position:relative;z-index:1;padding:0 30px 96px}
.cov .ed2{display:flex;justify-content:space-between;border-top:1px solid rgba(244,242,238,.3);padding-top:12px;margin-bottom:26px;color:rgba(244,242,238,.7)}
.cov h1{font-family:var(--serif);font-weight:300;font-size:68px;line-height:.92;letter-spacing:-.01em}
.cov h1 i{color:#C9A96A;font-weight:300}
.cov img.col{filter:none;height:calc(100% - 290px);object-position:60% 90%;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.cov.plain{justify-content:center}
.cov.plain .in{padding-top:40px}
.cov.plain .sub{margin-top:0;font-family:var(--serif);font-size:24px;line-height:1.3;color:var(--paper)}
.cov > .in > .cta:first-of-type{margin-top:30px}
.au p{font-size:14px;line-height:1.7;color:var(--ink2);font-weight:300;margin:0 0 12px}
.au .au-ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;margin:18px 0 22px;filter:none}
.au .au-role{margin:0 0 18px}
.au .cta{margin-top:26px}
.pad.au{padding-bottom:26px}
.au .pj-lead{font-family:var(--serif);font-size:24px;line-height:1.2;color:var(--ink);font-weight:300;margin:6px 0 16px;text-transform:uppercase}
.au .pj-sec{margin:34px 0 14px;color:var(--bronze);border-top:1px solid var(--rule);padding-top:14px}
.pj-steps div{display:grid;grid-template-columns:40px 1fr;column-gap:8px;padding:12px 0;border-bottom:1px solid var(--rule)}
.pj-steps span{font-family:var(--serif);color:var(--bronze);font-size:15px;grid-row:span 2}
.pj-steps b{font-family:var(--serif);font-weight:400;font-size:20px;text-transform:uppercase;line-height:1.15}
.au .pj-steps p{margin:4px 0 0;font-size:13.5px}
.pj-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pj-nums b{display:block;font-family:var(--serif);font-weight:300;font-size:44px;line-height:1;color:var(--ink)}
.pj-nums span{display:block;font-size:12px;line-height:1.4;color:var(--mute);margin-top:6px}
.cov .sub{margin-top:18px;font-size:14px;line-height:1.65;color:rgba(244,242,238,.78);font-weight:300;max-width:360px}
.toc{margin-top:26px;border-top:1px solid rgba(244,242,238,.22)}
.toc div{display:grid;grid-template-columns:44px 1fr;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(244,242,238,.22)}
.toc span{font-family:var(--serif);font-style:italic;color:#C9A96A;font-size:15px}
.toc b{font-family:var(--serif);font-weight:300;font-size:23px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:24px;border:1px solid rgba(244,242,238,.35)}
.seg button{text-align:center;padding:12px 6px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,242,238,.75)}
.seg button + button{border-left:1px solid rgba(244,242,238,.35)}
.seg button.on{background:var(--paper);color:var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;background:var(--paper);color:var(--ink);padding:18px 20px;font-size:11px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;text-decoration:none}
.cta:after{content:"→";font-size:16px;letter-spacing:0}
.cta.dk{background:var(--ink);color:var(--paper)}
.cta.br{background:var(--bronze);color:#fff}
.ghost{display:block;width:100%;text-align:center !important;margin-top:16px;font-size:10px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:rgba(244,242,238,.75);padding:6px}
.ghost u{text-decoration:none;border-bottom:1px solid var(--bronze2);padding-bottom:3px}
.ghost.lt{color:var(--ink2)}

/* шаги */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.prog span{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--mute)}
.prog span.on{color:var(--ink)}
.prog i{flex:1;height:1px;background:var(--rule)}
.prog i.on{background:var(--ink)}
.h2{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1.02;letter-spacing:-.01em;margin:10px 0 8px}
.h2 i{color:var(--bronze)}
.lede{font-size:13.5px;line-height:1.65;color:var(--mute);font-weight:300;max-width:380px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:22px}
.crumbs button{font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--bronze2);padding-bottom:2px}
.crumbs i{font-style:normal;color:var(--bronze)}

/* среда: римские цифры как разделы отчёта */
.envs{display:grid;grid-template-columns:repeat(4,1fr);margin:24px -22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.envs button{padding:14px 4px 12px;text-align:center !important;border-left:1px solid var(--rule);position:relative}
.envs button:first-child{border-left:0}
.envs b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;font-size:18px;color:var(--mute)}
.envs span{display:block;margin-top:4px;font-size:9.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.envs button.on{background:var(--ink)}
.envs button.on b{color:#C9A96A}.envs button.on span{color:var(--paper)}
.events{margin-top:6px}
.ev{display:grid;grid-template-columns:46px 1fr 18px;align-items:center;width:100%;padding:17px 0;border-bottom:1px solid var(--rule)}
.ev small{font-size:11px;color:var(--bronze);font-weight:500}
.ev b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.2}
.ev:after{content:"→";color:var(--ink2);font-size:15px}
.ev:active{background:var(--paper2)}

/* цели: типографский список */
.goals{margin-top:20px;border-top:1px solid var(--ink)}
.goal{display:grid;grid-template-columns:46px 1fr auto;align-items:baseline;width:100%;padding:15px 0 14px;border-bottom:1px solid var(--rule)}
.goal small{font-size:11px;color:var(--bronze);font-weight:500}
.goal b{font-family:var(--serif);font-weight:300;font-size:28px;line-height:1.1}
.goal em{font-style:normal;font-size:9.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.goal:active{background:var(--paper2)}

/* бриф и образы */
.brief{background:var(--ink);color:var(--paper);margin:0 -30px;padding:30px 30px 32px}
.brief .cap{color:#C9A96A}
.brief h2{font-family:var(--serif);font-weight:300;font-size:44px;line-height:1.02;margin:12px 0 18px}
.brief dl{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--rule-d)}
.brief dt,.brief dd{padding:11px 0;border-bottom:1px solid var(--rule-d);font-size:13px}
.brief dt{font-size:9.5px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,242,238,.55);padding-top:13px}
.principle{margin:30px 0 22px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:26px;line-height:1.38;color:var(--ink2)}
.looks{display:flex;gap:14px;overflow-x:auto;margin:0 -30px;padding:0 30px 8px;scroll-snap-type:x mandatory;scroll-padding-left:22px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.lk{flex:0 0 74%;scroll-snap-align:start}
.lk .im{position:relative;aspect-ratio:3/4;background:var(--paper2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.lk .im img{width:100%;height:100%;object-fit:cover;display:block}
.lk .im.fl{aspect-ratio:2/3;background:#F6F5F1}
.sol dl + .looks{margin-top:24px}
.lk .im.fl img{object-fit:contain}
.lk .im .n{position:absolute;left:12px;top:10px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2)}
.lk .im .ph{font-size:9.5px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.lk ul{list-style:none;margin-top:10px;border-top:1px solid var(--rule)}
.lk li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
.lk li a{text-decoration:none;border-bottom:1px solid var(--bronze2)}
.ph{background:rgba(156,123,79,.12);outline:1px dashed var(--bronze);padding:1px 6px;font-style:italic;color:#6f5a3a}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.pair button{text-align:center !important;padding:15px 6px;font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.pair button.dk{color:var(--bronze)}

/* тарифы: как прайс частного банка */
.tf-head{background:var(--ink);color:var(--paper);margin:0 -30px;padding:36px 30px 36px}
.tf-head .h2 i{color:#C9A96A}
.tf-head .lede{color:rgba(244,242,238,.65)}
.tf{padding:24px 0 22px;border-bottom:1px solid var(--rule)}
.tf .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tf .nm{font-size:12px;font-weight:400;letter-spacing:.34em}
.tf .who{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:right}
.tf .pr{font-family:var(--serif);font-weight:300;font-size:50px;line-height:1;margin:14px 0 2px;letter-spacing:-.01em}
.tf .pr small{font-family:var(--sans);font-size:11px;color:var(--mute);letter-spacing:.04em;margin-left:8px;font-weight:400}
.tf ul{list-style:none;margin-top:12px}
.tf li{font-size:13.5px;line-height:1.55;padding:4px 0 4px 18px;position:relative;color:var(--ink2)}
.tf li:before{content:"";position:absolute;left:0;top:13px;width:9px;height:1px;background:var(--bronze)}
.tf .pick{display:inline-flex;gap:10px;align-items:center;margin-top:14px;font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:4px}
.tf.hi{position:relative}
.tf.hi .badge{display:block;margin-bottom:10px;color:var(--bronze);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase}
.tf.hi .pick{border-bottom-color:var(--bronze);color:var(--ink)}
.note{margin-top:30px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:22px;line-height:1.45;color:var(--ink2)}

/* док и шторка */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding-bottom:env(safe-area-inset-bottom);z-index:50;display:flex;align-items:stretch;
  background:var(--ink);color:var(--paper);border-radius:0;border-top:1px solid rgba(244,242,238,.12);overflow:hidden;transition:transform .3s ease,opacity .3s ease}
.dock.hide{transform:translate(-50%,calc(100% + 2px));opacity:0;pointer-events:none}
.dock button,.dock a{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;cursor:pointer;
  font-family:var(--sans);font-size:10px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.dock > * + *{border-left:1px solid rgba(244,242,238,.14)}
.dock .ic{color:#C9A96A;font-size:13px;letter-spacing:0}
.dock .off{display:none !important}
.dock .d-docs{flex:0 0 auto;padding:0 16px;color:#C9A96A}
.view{padding-bottom:calc(49px + env(safe-area-inset-bottom))}
.sheet .docs{display:grid;gap:0;margin-top:6px}
.sheet .docs a{display:block;padding:16px 0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:20px;color:var(--ink);text-decoration:none}
.dock .d-sup{padding:0 18px;color:#C9A96A;flex:0 0 auto}
.dock button{flex:1 1 0;justify-content:center;padding:0 8px}
.dock button:active,.dock a:active{background:#262626}
.sheet-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:86svh;overflow-y:auto;background:var(--paper);
  padding:14px 30px calc(30px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.menu-on .sheet-bg{opacity:1;pointer-events:auto}.menu-on .sheet{transform:none}
.sheet .grab{width:36px;height:3px;background:var(--rule);margin:0 auto 18px}
.sheet .quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .quick button{text-align:center !important;border:1px solid var(--ink);padding:12px 6px;font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase}
.sheet .quick button.on{background:var(--ink);color:var(--paper)}
.sheet .quick a.help{grid-column:1/-1;display:block;text-align:center;background:var(--ink);color:var(--paper);padding:13px 6px;font-size:10px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
/* 06.11 «На экран телефона»: шаги из guide/image-install.js */
.ii-steps{list-style:none;padding:0;margin:26px 0 0;border-top:1px solid var(--ink)}
.ii-steps li{display:grid;grid-template-columns:34px 1fr 44px;gap:14px;align-items:center;padding:18px 0;border-bottom:1px solid var(--rule)}
.ii-n{font-family:var(--serif);font-weight:300;font-size:30px;line-height:1;color:var(--bronze)}
.ii-t{font-size:16px;line-height:1.45;font-weight:300;color:var(--ink)}
.ii-t small{display:block;margin-top:5px;font-size:13.5px;line-height:1.45;color:var(--mute)}
.ii-steps b{font-weight:500}
.ii-ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:11px;color:var(--ink)}
.ii-ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ii-ico.ii-app{border:0;overflow:hidden}.ii-app img{width:44px;height:44px;border-radius:11px;display:block}
.ii-key{margin-top:22px;padding:16px 18px;border-left:2px solid var(--bronze);background:var(--paper2);font-size:15px;line-height:1.5;font-weight:300;color:var(--ink2)}
.ii-key b{font-weight:500;color:var(--ink)}
.ii-copy{display:block;width:100%;margin-top:12px;border:1px solid var(--ink);padding:13px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;text-align:center !important;color:var(--ink)}
.ii-install{display:block;width:100%;margin-top:22px;padding:16px;background:var(--ink);color:#C9A96A;font-size:11px;letter-spacing:.28em;text-transform:uppercase;text-align:center !important}
.ii-done{margin-top:20px;padding:18px;border:1px solid var(--bronze);font-size:16px;font-weight:300}
.ii-install[hidden],.ii-done[hidden]{display:none !important}
.sheet h3{display:flex;justify-content:space-between;margin:24px 0 2px;font-size:10px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:var(--bronze)}
.sheet h3 i{font-family:var(--serif);font-size:13px;letter-spacing:0;text-transform:none}
.sheet .ev{padding:12px 0;grid-template-columns:40px 1fr 18px}
.sheet .ev b{font-size:16px}
.sheet .ev.cur b{color:var(--bronze)}

#legal{display:none;padding:18px 16px calc(66px + env(safe-area-inset-bottom));text-align:center;font-size:11px;line-height:1.8;color:var(--mute);background:var(--paper);border-top:1px solid var(--rule)}
#legal a{color:inherit;margin:0 9px;white-space:nowrap}
/* узкие заглавные вместо антиквы: курсив убран, акцент цветом */
.top .logo{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase}
.cov h1,.h2,.brief h2,.toc b,.ev b,.goal b,.tf .pr,.sol h2{font-weight:400;text-transform:uppercase;letter-spacing:.005em}
.cov h1{font-size:76px;line-height:.9}
.h2{font-size:52px;line-height:.95}
.h2 i,.cov h1 i,.tf-head .h2 i{font-style:normal}
.toc span,.prog span,.envs b,.lk .im .n,.sheet h3 i{font-style:normal;font-family:var(--serif)}
.toc b{font-size:22px;font-weight:300}
.cov.plain .sub,.principle,.note{font-family:var(--sans);font-style:normal;font-weight:300}
.cov.plain .sub{font-size:18px;line-height:1.5}
.principle{font-size:18px;line-height:1.6}
.note{font-size:17px;line-height:1.6}
.sheet .docs a{font-family:var(--sans);font-size:15px;letter-spacing:.04em}
.ev b{font-size:20px;font-weight:300}
.goal b{font-size:24px;font-weight:300}
.tf .pr{font-size:44px;font-weight:300}
.brief h2{font-size:40px}
/* шаг: номер и пейджер */

var EN_COMMENTS = {
  'Casual Friday':'Casual Friday is not a day off. It is the hardest test: the freest clothes must not get in the way of the work.\nTo me, Casual Friday is a chance to show ambition and a creative mind through bold colour and cuts that the place can hold.\nA bright detail is always character. If four days keep you within limits, on Friday choose looks that are in the current conversation.',
  'Cocktail':'Cocktail joins the plain with a celebration. It differs from black tie in the depth of colour and in the luxury.',
  'Презентация, питч':'What matters in the moment is to show your voice, your weight and your thought, and to pass them to the people in front of you.',
  'Публичное выступление, конференция, networking':'What matters in the moment is to show your voice, your weight and your thought, and to pass them to the people in front of you.',

["On the hand that holds the glass, wear your brightest jewel.","That is why they are called cocktail jewels."],
["Try to live an interesting evening in this look.","Watch your posture, and ask what you would think of yourself if you saw yourself from the side.",""]
],
"Zoom|Вызвать доверие|w":[
["Always come on with the camera on.","When the other person sees your face and your reaction, it is easier to understand you and to trust what you say."],
["Give particular attention to the portrait zone.","On Zoom this is the most visible part of the look. The frame of your glasses, jewellery, a collar, a neckline and everything near the face keep attention on you and show you from the angle you choose."],
["Set the camera at eye level and check the background.","A camera opposite the face makes the talk feel equal. Take personal and domestic things out of the frame. Attention should stay on you and on the conversation."],
["Work with the voice.","Speak a little slower than in an ordinary talk, finish your words and leave short pauses between thoughts. Calm, clear speech helps the other person follow you and strengthens trust."],
["Say what matters to the camera.","When you look at the other face on the screen, your gaze moves slightly aside for them. At the key moments, look into the lens. On Zoom that replaces a direct look in the eye."],
["Let the person feel that you hear them.","Do not switch to messages and other tasks. Hear the thought to the end, and only then answer. Trust grows when a person feels not only your attention, but your interest in what they say.",""]

"Zoom|Привести к решению|w":[
["Attend to the portrait zone.","Even a simple jumper with a finished neckline is far better than a house t-shirt. A prepared appearance shows respect for yourself, for the format and for the people on the other side of the screen."],
["Add one detail that draws the eye to your face.","A frame, earrings, a brooch, a jewel at the neck or a clear lipstick hold attention in the portrait zone. The task is to send the other person's gaze to the face and to the speech."],
["Look at how you appear on the screen.","Judge yourself not only in the mirror, but in the frame itself. The light should show the eyes, the expression and the movement of the lips. On Zoom the face is the main source of what is not said."],
["Take what is unnecessary out of the frame.","The background should not pull the other person into your private life. The less accidental information around you, the more attention stays on you and on the talk."],
["Remember the timbre and the speed of speech.","Speak a little slower than you usually do, and do not raise the voice to strengthen a thought. A calm timbre and an even pace keep the sense of confidence without pressure."],
["Show a reaction.","Do not stay still while the other person speaks. Answer with the face, a short nod, a pause before you reply. They see that you are listening and that you take in what was said.",""]
],
"Бизнес|*|w":[
["Watch the people you are about to talk to.","Notice the watch, the frame, the jewels, the shoes, the bags, the cases, the vintage. Each choice tells you something: habits, taste, a relation to money, to detail and to their own status. These observations help you understand who you will be talking to."],
["Study the details and the accessories.","In business the quality of things is recognised easily. If your wardrobe is still in another segment, choose neutral decisions. Instead of trying to impress with an expensive watch, leave the wrist free. Instead of a bag that imitates a higher segment, choose a good thing with no recognisable name. If this circle opened the door, you are already inside it."],
["Show status precisely.","One status piece is enough. The rest is carried by neatness, the condition of clothes and shoes, etiquette and a correct scent. Another marker of status in business is the ability to listen. Let the person finish, and show by your attention that their words matter to you."],
["Control the degree of formality.","A buttoned jacket, a closed shirt and strict shoes assemble the look. A jacket off, an open collar, turned sleeves and less formal shoes make it welcoming. Change the degree according to the task and the stage of the meeting."],
["Take your own level of freedom as the measure.","A t-shirt, jeans and trainers on a successful founder can be a freedom that reputation has paid for. Watch those codes, and choose what matches your life, your position and the way you do business."],
["Keep the etiquette of the bag.","During a business meeting the bag sits by your chair. The table stays the space for the talk and the work."],
["Remember that the body states your position.","When you name a price, stay sure of it. Readiness for a larger scale begins with an inner readiness to accept that scale, including the financial one. Gesture, gaze, the position of the body and the way you speak should confirm your position."],
["Use a calm voice.","A calm tone and an even pace become a strong instrument when you need to show competence, to persuade, or to bring the talk to the result you need."],
["Keep a woman's position in talks with men.","Remember first that you are a woman. Use that as part of your own manner, and keep the professional position, the boundaries and the subject. Equality in business is set by the value each side brings to the table."],
["Use details for the task.","Red adds energy and gathers attention. A strong frame sharpens the focus on the eyes. A current jewel shows that you know the visual language of now. Choose each instrument by the task and by whether it belongs."],
["A high level in business is rarely read from the price of the wardrobe.","Confidence is the absence of unnecessary action.",""]
],
"Встреча с командой|Показать готовность работать в команде|w":[
["Keep to the team's dress code.","Stay with the shared degree of formality and the visual language of your workplace. Belonging starts with understanding its codes."],
["Create a sign of belonging.","A scarf, a brooch, a pin or a thing made for the purpose can become the team's mark. Things that only its members receive have a particular value."],
["Leave room to interpret.","Do not turn a shared code into a uniform. Let each person wear the uniting element in their own way. Belonging stays, and so does the person. Do not take away the chance to appear."],
["Mark your role.","If you lead, you do not have to dress differently from the team. Raise the shared dress code by one level through the fit, the construction, the quality of the cloth, the shoes, a watch or the accessories."],
["Introduce a dress code for particular days.","A launch, an anniversary, a financial result, an important event or the end of a long stage can have its own visual code. Repeated details slowly become part of the team's story."],
["Make your own rituals, and remember: respect for yourself is respect for how you look.","Regular rituals give a team the sense of a shared experience and of belonging.",""]
],
"Встреча с руководством|Вызвать доверие|w":[
["Show that you belong to the professional setting.","Use a recognisable code of your company or industry, and interpret it at your own level. It shows that you understand the setting and can live inside its rules without losing yourself."],
["Check the quality from the distance of a conversation.","At a meeting the cloth, the collar, the hardware, the shoes, the bag, the jewels and the condition of things are especially visible. Precision in the details supports the impression of a person who is careful not only with herself, but with what is trusted to her."],
["Check the look while seated.","Before the meeting, sit down in the full look and see how the jacket, the skirt or the trousers behave. A woman's jacket does not have to be undone. Undo it if, once you sit, it pulls, gaps or limits movement."],
["Choose a position of the legs that you do not have to control.","Both feet on the floor, or the legs together with a small shift to the side, is the most neutral seat for a formal meeting. Legs crossed are acceptable if the skirt keeps a correct length, the pose stays stable and you do not have to keep adjusting the clothes."],
["Keep your own voice.","Do not start to speak more quietly, higher or more carefully because of the title across from you. An even voice and your usual manner show that you recognise the hierarchy and do not reduce your own professional weight."],
["Do not rush to agree.","Hear the manager to the end, give yourself a short pause, and only then answer. Trust comes not from a display of compliance, but from the ability to take in information calmly, think it through and state your own position.",""]
],
"Встреча с руководством|Показать компетентность|w":[
["Choose clothes for the task of the meeting.","Consider whether you will sit, speak, show materials or move. Clothes should not ask for attention while you work."],
["Watch the precision of the fit.","Check the length of sleeves and trousers, the position of the shoulders, the collar and the waist. Precision in clothes supports the sense of the same precision in the work."],
["Show that you understand the professional context of now.","Add one current element: a frame, shoes, a jewel or a contemporary cut. Do not build the look out of trends. It is enough to show that you know how to use them."],
["Break an office code on purpose.","If the company allows it, replace the expected decision with your own: a jacket with architectural knit, a classic shirt with a more current construction. To step away from a rule professionally, you first have to understand the rule."],
["Free your hands before the meeting.","Put the phone away, close the bag and take out what you need in advance. Start the talk without searching for things and without extra movement."],
["Listen to how your manager phrases things.","Notice what is repeated, what is clarified and where the emphasis falls. The speech often already contains the result that is expected of you.",""]
],
"Деловые встречи в ресторане|*|w":[
["The earlier the meeting, the simpler the clothes and the accessories.",""],
["A restaurant does not cancel the business nature of the meeting.",""],
["Remember: a business meal stays business, not personal.","",""]
],
"Командировка|*|w":[
["First decide the format of the trip.","Choose pieces that have never let you down.\nStart the capsule from the lower half of the silhouette.\nOne pair of trousers, one skirt.\nThen add several tops. Each of them should work with the bottom you chose, so a few pieces give you several looks."],
["Always plan one evening option.","It is enough to change the top, add jewels and a small bag."]
],
"Корпоратив, Black Tie|Показать стиль|w":[
["Remember that a company party is not the office.",""],
["At a company party you make an impression by keeping the dress code and using invention.","For example, add one detail whose meaning is clear only to you."],
["A company party can open a new conversation.",""],
["Remember: a woman does not wear a watch with an evening dress.",""],
["Nothing is worse than a tired woman in sequins.","The factors that matter: the hands, the hair, the skin of the face and the smile. That is your instrument.\nTo show style is not the same as to show that you know the trends.\nA dress code is your delicate interpretation, and it depends on how much true information you read.",""]
],
"Новая должность, повышение|*|w":[
["Do not change the whole wardrobe at once.","A wardrobe should change gradually, with you. Do not try to look, in one day, like a person in the new role. Give yourself time to get used to the new level."],
["Choose one thing that is expensive for you.","Buy the best of the segment you can afford. That is how you introduce yourself to another quality of cloth, cut, fit and making. Slowly this level stops being an exception and becomes your norm."],
["Mark the new stage with a new thing.","It can be a cashmere jumper, a bag, a watch, a jewel, shoes or a scent. Choose what a new level means to you personally. Such a thing fixes the change on the outside and on the inside."],
["If you wear glasses, start with the frame.","The frame sits by the eyes, in the main zone of the other person's attention. Even a good suit can lose its currency next to an outdated frame. Check its shape, its scale and how far it matches you today."],
["Do not turn a promotion into a jacket.","A new role does not automatically require you to become more formal. It requires more attention to yourself. Keep your own style, and make it more precise, of better quality and more grown relative to the new role."],
["Raise what you require of your appearance.","A promotion does not cancel a dress code or neatness. The opposite: a new responsibility asks for more precision. Watch the condition of clothes, shoes, hair and details. Set yourself a more ambitious visual standard."],
["Add red.","Use it in one place: shoes, a frame, a bag, lipstick, knit or a small detail. Red gathers attention and adds energy and force. If you were promoted, your opinion is already trusted. Allow yourself to mark it visually."],
["Take the new role as yours.","Do not ask whether you deserve the new title. The decision is already made. You were promoted because someone saw that you can handle more. Do not wait until you feel completely ready. Change the wardrobe, the habits and what you require of yourself gradually, but treat yourself from the position of the new role now.",""]
],
"Офис|Вызвать доверие|w":[
["Read the DNA of the place.","If the office has a dress code, find one element that is characteristic of it and interpret it in your own style. If there is no dress code, rely on your own visual identity. Authenticity makes a person easier to read and more convincing."],
["Account for how closely the clothes sit.","Leave space between the body and the clothes. Freedom of fit gives freedom of movement, and the body's line becomes calmer and more natural."],
["Attend to the portrait zone.","Look at yourself cropped at the chest. Hair, the frame, jewels and the line of the neck make the first impression before the other person has time to see the whole look."],
["Set the order of perception.","Look at yourself for a few seconds and notice where the eye goes first. For trust, a strong sequence is the face, then the whole look, then the details. That visual clarity makes the first reading easier."],
["Account for how the look feels to the touch.","Add a texture that the eye associates with a pleasant touch: cashmere, knit, suede, soft leather, a cloth that moves. Tactile associations can psychologically shorten the distance."],
["Find your recognisable mark.","Choose one characteristic detail and repeat it from time to time: a frame, a watch, earrings, a ring, a brooch. Repetition builds recognition, and what is familiar sooner feels predictable."],
["Hold eye contact.","During an introduction or a talk, hold the gaze a little longer than you usually do. A direct, calm look strengthens the sense of openness and attention. If the other person looks away first, shorten the contact. The other person's comfort also affects trust.",""]

"Офис|Показать компетентность|w":[

"Офис|Показать статус|w":[
["Choose one thing of a high level.","It can be a bag, a watch, a jewel, shoes or a frame. One object of obvious quality, or of a recognisable origin, can set the level of the whole look."],
["Bet on quality that is visible from close up.","Look at the material, the hardware, the edge and the construction. In an office, status is often read from a short distance, through the quality of the making."],
["Use recognisable codes where they will be read.","A logo, a cult model, vintage or a significant jewel work with particular precision in a circle that understands what they mean. The higher the visual literacy of the audience, the more information one object can carry."],
["Allow yourself your own interpretation of the office code.","Knowing the rules gives the freedom to handle them in your own way. An unusual proportion, a designer piece, vintage or a rare accessory can be read as confidence in your own position."],
["Check that status markers are genuine.","If a thing is meant to speak of status through a brand name, its authenticity is part of that message. In a circle that knows the original, the quality of the leather, the hardware, the proportions and the making are read very quickly. An original from a less famous house, or good vintage, gives a more convincing signal than a replica of a famous model."],

"Офис|Показать открытость новому|w":[

["Leave outdated rules of combination behind.","A suit today does not require classic shoes, and an evening piece does not require an evening reason. Contemporary styling shows a contemporary way of thinking."],

/*RULES*/var RULES = {"Casual Friday|*|w":[["Помните: стиль это ваши ощущения, имидж это ваши амбиции на уровень жизни.","",1]],"Cocktail|*|w":[["Умение собрать образ cocktail показывает ваш авантюризм.",""],["В таких образах проверяется ваша уверенность.",""],["На той руке, которой вы держите бокал, следует надеть самое яркое украшение.","Именно поэтому украшения называются коктейльными."],["Попробуйте в этом образе прожить интересный вечер.","Следите за осанкой и подумайте, что бы вы подумали о себе, если бы увидели со стороны?",1]],"Zoom|Вызвать доверие|w":[["Всегда выходите с включённой камерой.","Когда собеседник видит ваше лицо и реакцию, ему проще понимать вас и доверять тому, что вы говорите."],["Уделите особое внимание портретной зоне.","В Zoom это самая заметная часть образа. Оправа очков, украшения, воротник, вырез и всё, что находится рядом с лицом, помогают удержать внимание на вас и показать себя именно в том ракурсе, который вы выбираете."],["Поставьте камеру на уровень глаз и проверьте фон.","Камера напротив лица создаёт ощущение разговора на равных. Уберите из кадра личные и бытовые вещи: внимание должно оставаться на вас и разговоре."],["Работайте с голосом.","Говорите чуть медленнее, чем в обычном разговоре, не проглатывайте окончания и оставляйте небольшие паузы между мыслями. Спокойная, понятная речь помогает собеседнику следовать за вами и усиливает доверие."],["Говорите важное в камеру.","Когда вы смотрите на лицо собеседника на экране, для него ваш взгляд уходит немного в сторону. В ключевые моменты переводите глаза в объектив — в Zoom это заменяет прямой взгляд в глаза."],["Дайте человеку почувствовать, что вы его слышите.","Не переключайтесь на сообщения и другие задачи, дослушивайте мысль до конца и только потом отвечайте. Доверие усиливается, когда человек чувствует не только ваше внимание, но и интерес к тому, что он говорит.",1]],"Zoom|Привести к решению|w":[["Уделите внимание портретной зоне.","Даже простой джемпер с собранной горловиной намного лучше домашней футболки. Подготовленный внешний вид показывает уважение к себе, формату встречи и людям по ту сторону экрана."],["Добавьте деталь, которая привлечёт внимание к вашему лицу.","Оправа, серьги, брошь, украшение у шеи или выразительная помада удерживают внимание в портретной зоне. Задача — направить взгляд собеседника к лицу и речи."],["Посмотрите, как вы выглядите на экране.","Оценивайте себя не только в зеркале, но и непосредственно в кадре. Свет должен хорошо показывать глаза, мимику и движение губ — в Zoom лицо становится главным источником невербальной информации."],["Уберите лишнее из кадра.","Фон не должен отвлекать собеседника на вашу личную жизнь. Чем меньше случайной информации вокруг, тем больше внимания остаётся на вас и разговоре."],["Не забывайте о тембре и скорости речи.","Говорите немного медленнее привычного и не повышайте голос, чтобы усилить мысль. Спокойный тембр и ровный темп поддерживают ощущение уверенности без давления."],["Показывайте реакцию.","Не оставайтесь неподвижной, когда говорит другой человек. Реагируйте мимикой, коротким кивком, выдерживайте паузу перед ответом — собеседник видит, что вы его слушаете и учитываете сказанное.",1]],"Zoom|*|m":[["В очной встрече впечатление формируют рост, походка, осанка, рукопожатие, дистанция, одежда, жесты, голос и поведение в пространстве.\\nВ Zoom значительная часть этих сигналов либо исчезает, либо ограничивается небольшим прямоугольником экрана.",""],["В Zoom портретная зона это основное пространство визуальной коммуникации.","В неё входят лицо, волосы, очки, воротник, плечевой пояс, верхняя часть одежды, иногда часы и руки. Фон, освещение и качество изображения влияют на то, насколько хорошо эти элементы считываются."],["Обрамляйте своё лицо в цвета, которые вам подходят.","Используйте инструмент приложения «Система имиджа». Загрузите своё фото, чтобы понять свою контрастность, и ориентируйтесь на рекомендации."],["Даже если работаете из дома, выходите подготовившись.","У ваших собеседников не должно быть диссонанса при личной встрече."],["Фон влияет на оценки доверия и компетентности.","Сделайте фон вне кухни."],["Включайте камеру, когда визуальный контакт помогает достичь цели встречи.","Не превращайте камеру в проверку дисциплины."],["Сначала старайтесь понять, а потом быть понятым.",""],["То, что останавливает в развитии, это сомнения.","Натренируйте свой навык: устойчивость к изменениям, и вы будете понимать, как вести разговор.",1],["Помните: ваши возможности на расстоянии вашего голоса.",""]],"Бизнес|*|w":[["Понаблюдайте за людьми, с которыми вам предстоит разговор.","Обратите внимание на часы, оправу, украшения, обувь, сумки, портфели, винтаж. Каждый выбор даёт информацию о человеке: его привычках, вкусе, отношении к деньгам, деталям и собственному статусу. Эти наблюдения помогают понять, с кем вы будете вести разговор."],["Изучите детали и аксессуары.","В бизнес-среде качество вещей хорошо распознаётся. Если ваш гардероб пока относится к другому сегменту, выбирайте нейтральные решения. Вместо попытки произвести впечатление дорогими часами оставьте запястье свободным. Вместо сумки, имитирующей высокий сегмент, выберите качественную вещь без узнаваемого имени. Если это общество открыло вам двери, значит, вы уже внутри него."],["Показывайте статус точно.","Одного статусного элемента достаточно. Остальное передаётся через опрятность, состояние одежды и обуви, этикет и корректный аромат. Ещё один важный маркер статуса в бизнесе — умение слушать. Дайте человеку закончить мысль и покажите вниманием, что его слова имеют для вас значение."],["Управляйте формальностью.","Застёгнутый жакет, закрытая рубашка и строгая обувь собирают образ. Снятый жакет, открытый ворот, закатанные рукава и менее формальная обувь делают его располагающим. Меняйте степень формальности в зависимости от задачи и этапа встречи."],["Ориентируйтесь на собственный уровень свободы.","Футболка, джинсы и кроссовки успешного предпринимателя могут быть свободой, обеспеченной репутацией. Наблюдайте за такими кодами, но выбирайте то, что соответствует вашему образу жизни, положению и манере вести бизнес."],["Соблюдайте этикет сумки.","Во время деловой встречи сумка располагается возле вашего кресла. Стол остаётся пространством для разговора и работы."],["Помните, что тело сообщает о вашей позиции.","Называя цену, оставайтесь уверенной в ней. Готовность к большему масштабу начинается с внутренней готовности принять этот масштаб, в том числе финансовый. Жесты, взгляд, положение тела и манера говорить должны подтверждать вашу позицию."],["Используйте спокойный голос.","Спокойный тон и ровный темп речи становятся сильным инструментом, когда нужно показать компетентность, убедить собеседника или привести разговор к нужному результату."],["Сохраняйте женскую позицию в переговорах с мужчинами.","Помните в первую очередь, что вы женщина. Используйте женственность как часть собственной манеры общения, сохраняя профессиональную позицию, границы и предмет разговора. Равенство в бизнесе определяется ценностью, которую каждая сторона приносит за стол переговоров."],["Используйте детали для своей задачи.","Красный добавляет энергии и собирает внимание. Сильная оправа усиливает фокус на глазах. Актуальное украшение показывает знание современного визуального языка. Выбирайте каждый инструмент по задаче и уместности."],["Высокий уровень в бизнесе редко считывается по стоимости гардероба.","Уверенность — это отсутствие лишних действий.",1]],"Встреча с командой|Показать готовность работать в команде|w":[["Поддерживайте дресс-код команды.","Сохраняйте общую степень формальности и визуальный язык своей рабочей среды. Принадлежность к команде начинается с понимания её кодов."],["Создайте знак принадлежности.","Платок, брошь, значок или специально созданная вещь могут стать отличительным знаком команды. Ценны предметы, которые получают только её участники."],["Оставляйте свободу интерпретации.","Не превращайте общий код в униформу. Пусть каждый носит объединяющий элемент по-своему — принадлежность сохраняется вместе с индивидуальностью. Не лишайте людей возможности проявиться."],["Обозначайте свою роль.","Если вы руководитель, не обязательно одеваться иначе, чем команда. Поднимите общий дресс-код на один уровень за счёт посадки, конструкции, качества материала, обуви, часов или аксессуаров."],["Вводите дресс-код для особых дней.","Запуск проекта, годовщина команды, финансовые успехи, важное событие или завершение большого этапа могут иметь свой визуальный код. Повторяющиеся детали постепенно становятся частью истории команды."],["Создавайте свои ритуалы и помните, уважение к себе это уважение к внешнему виду.","Регулярные ритуалы дают команде ощущение общего опыта и принадлежности.",1]],"Встреча с руководством|Вызвать доверие|w":[["Покажите принадлежность к профессиональной среде.","Используйте в образе узнаваемый код вашей компании или индустрии — и интерпретируйте его на своём уровне. Это показывает понимание среды и умение существовать внутри её правил без потери индивидуальности."],["Проверьте качество с расстояния разговора.","На встрече особенно заметны ткань, воротник, фурнитура, обувь, сумка, украшения и состояние вещей. Точность в деталях поддерживает впечатление человека, который внимательно относится не только к себе, но и к тому, что ему доверяют."],["Проверьте образ сидя.","Перед встречей сядьте в полном образе и посмотрите, как ведут себя жакет, юбка или брюки. Женский жакет не обязательно расстёгивать: сделайте это, если при посадке он натягивается, расходится или ограничивает движения."],["Выберите положение ног, которое не нужно контролировать.","Обе стопы на полу или ноги, собранные вместе с небольшим смещением в сторону, — наиболее нейтральная посадка для формальной встречи. Нога на ногу допустима, если юбка сохраняет корректную длину, поза остаётся устойчивой и вам не приходится постоянно поправлять одежду."],["Сохраняйте свой голос.","Не начинайте говорить тише, выше или осторожнее из-за должности человека напротив. Ровный голос и привычная манера речи показывают, что вы признаёте иерархию, но не уменьшаете собственную профессиональную значимость."],["Не спешите соглашаться.","Выслушайте руководителя до конца, дайте себе короткую паузу и только затем отвечайте. Доверие вызывает не демонстративная покладистость, а способность спокойно воспринимать информацию, обдумывать её и формулировать собственную позицию.",1]],"Встреча с руководством|Показать компетентность|w":[["Выбирайте одежду под задачу встречи.","Учитывайте, будете ли вы сидеть, выступать, показывать материалы или перемещаться. Одежда не должна требовать внимания во время работы."],["Следите за точностью посадки.","Проверьте длину рукавов и брюк, положение плеч, воротника и линии талии. Точность в одежде поддерживает ощущение такой же точности в работе."],["Покажите, что понимаете современный профессиональный контекст.","Добавьте один актуальный элемент: оправу, обувь, украшение или современный крой. Не собирайте образ из трендов — достаточно показать, что вы умеете ими пользоваться."],["Нарушайте офисный код осознанно.","Если корпоративная среда это позволяет, замените ожидаемое решение на своё: жакет — на архитектурный трикотаж, классическую рубашку — на более современную конструкцию. Чтобы отступить от правила профессионально, сначала нужно понимать само правило."],["Освободите руки перед встречей.","Уберите телефон, закройте сумку и заранее достаньте необходимые материалы. Начинайте разговор без поиска вещей и лишних движений."],["Слушайте формулировки руководителя.","Замечайте, что он повторяет, уточняет и на чём делает акцент. В его речи часто уже содержится информация о том, какого результата от вас ждут.",1]],"Встреча с руководством|Показать компетентность|m":[["Этикет и уважение к себе.","Этикет существовал, существует и будет существовать. Меняется дресс-код, но уважение к себе и собеседнику остаётся неизменным.\nКостюм на встрече с руководством прежде всего демонстрирует ваше отношение к себе и значимости разговора.\nСегодня костюм перестал быть обязательным во многих компаниях. Но порядочность всегда остаётся в тренде. Её подтверждают ваши поступки, договорённости и отношение к людям."],["Индивидуальность и собственное мнение.","Правила можно нарушать, если вы понимаете их назначение.\nКлассический костюм с необычной обувью, включая кроссовки, может говорить о самостоятельности и гибкости мышления.\nТакая деталь работает, когда она уместна в профессиональной среде и выглядит осознанным решением.\nИндивидуальность проявляется в умении выбирать, а не в желании отличаться."],["Говорите на языке своего окружения.","Перед встречей поставьте себя на место собеседника.\nС кем бы вы сами захотели продолжить общение?\nЛюди чаще доверяют тем, в ком узнают близкие ценности и культурные коды.\nДля одних костюм является признаком профессионализма. Для других футболка и спортивные брюки составляют привычный деловой гардероб.\nУчитывайте среду, в которой хотите развиваться, и людей, с которыми планируете работать.\nВаш образ должен помогать коммуникации, а не требовать объяснений."],["Не становитесь усреднённой версией себя.","Искусственный интеллект сделал готовые решения доступными каждому. Использование ИИ только как поисковика может привести к одинаковым рекомендациям, образам и формулировкам.\nВаша ценность заключается в собственном опыте, мышлении и способности принимать решения.\nНе отказывайтесь от индивидуальности ради соответствия усреднённым стандартам.\nАмбиции требуют не подражания, а самостоятельности."],["Не удивляйте руководство часами.","Если вас пригласили на встречу, у собеседника уже есть основание уделить вам время.\nНе пытайтесь подтверждать свою значимость дорогими часами, логотипами и демонстративными аксессуарами.\nЕсли у вас нет часов, не покупайте их специально для встречи.\nСегодня дорогими вещами трудно удивить. Гораздо важнее ваша профессиональная ценность.\nЭнергия человека формирует стиль. Вещи лишь помогают её выразить."],["Задавайте вопросы.","Не превращайте встречу с руководством в экзамен, на котором вы только отвечаете.\nЗадавайте содержательные вопросы. Это демонстрирует вовлечённость, интерес к задачам и способность анализировать информацию.\nУточняйте цели, приоритеты, ограничения и ожидаемый результат.\nНередко ответ руководителя содержит решение, необходимое для вашей дальнейшей работы.\nУмение задавать вопросы помогает влиять на ход разговора и принимать более точные решения."],["Не принижайте себя.","Должность собеседника не уменьшает вашу профессиональную ценность.\nНе обесценивайте свои результаты, не оправдывайтесь за амбиции и не отказывайтесь от собственного мнения из страха возражений.\nСкромность может быть достоинством, но не должна мешать демонстрировать компетентность.\nСтрах и робость никогда не были хорошими консультантами в вопросах профессионального развития.\nУважайте авторитет руководителя, не отказываясь от собственного."],["Показывайте готовность к следующему уровню.","Не пытайтесь выглядеть человеком, которым ещё не стали.\nГоворите о результатах, предлагайте решения, аргументируйте свою позицию и демонстрируйте готовность брать ответственность.\nВнешний вид задаёт тон встрече. Голос помогает донести позицию. Вопросы показывают вовлечённость. Поведение подтверждает компетентность."],["Не просите признания.","Дайте основания доверить вам больше.",1]],"Деловые встречи в ресторане|*|w":[["Чем раньше встреча, тем проще одежда и аксессуары.",""],["Ресторан не отменяет деловой характер встречи.",""],["Помните: деловая встреча в ресторане остаётся деловой, а не личной.","",1]],"Командировка|*|w":[["Сначала определите формат поездки.","Выберите вещи, которые вас никогда не подводили.\nНачните собирать капсулу с нижней части силуэта.\nОдни брюки, одну юбку.\nЗатем добавьте несколько вариантов верха. Каждый из них должен сочетаться с выбранным низом, так при минимальном количестве вещей вы получите несколько образов."],["Обязательно предусмотрите один вечерний вариант.","Достаточно заменить верх, добавить украшения и маленькую сумку."]],"Корпоратив, Black Tie|Показать стиль|w":[["Важно помнить, что корпоратив это не то же самое, что офис.",""],["Произвести впечатление на корпоративе можно за счёт соблюдения правил дресс-кода, используя креатив.","Например, добавьте одну деталь, смысл которой будет понятен только вам."],["Корпоратив может стать возможностью для новой коммуникации.",""],["Помните: девушки не надевают часы к вечернему платью.",""],["Нет ничего хуже уставшей женщины в пайетках.","Самые важные факторы: руки, волосы, кожа лица и улыбка. Вот ваше оружие!\nПродемонстрировать стиль не равно показать знание трендов.\nДресс-код это ваша деликатная интерпретация и зависит он от количества аутентичной информации, которую вы читаете.",1]],"Новая должность, повышение|*|w":[["Не меняйте весь гардероб сразу.","Гардероб должен меняться постепенно, вместе с вами. Не пытайтесь за один день начать выглядеть как человек на новой должности. Дайте себе время привыкнуть к новому уровню."],["Выберите одну дорогую для себя вещь.","Купите лучшее из того сегмента, который можете себе позволить. Так вы знакомите себя с другим качеством ткани, кроя, посадки и исполнения. Постепенно этот уровень перестаёт казаться исключением и становится вашей нормой."],["Обозначьте новой вещью новый этап.","Это может быть кашемировый джемпер, сумка, часы, украшение, обувь или аромат. Выберите то, что лично для вас означает новый уровень. Такая вещь помогает зафиксировать изменение не только внешне, но и внутренне."],["Если носите очки, начните с оправы.","Оправа находится у глаз, в главной зоне внимания собеседника. Даже хороший костюм может потерять актуальность рядом с устаревшей оправой. Проверьте её форму, масштаб и то, насколько она соответствует вам сегодня."],["Не превращайте повышение в пиджак.","Новая должность не требует автоматически становиться формальнее. Она требует большего внимания к себе. Сохраняйте собственный стиль, но делайте его точнее, качественнее и взрослее относительно новой роли."],["Поднимите требования к своему внешнему виду.","Повышение не отменяет дресс-код и опрятность. Наоборот, новая ответственность требует большей точности. Следите за состоянием одежды, обуви, волос и деталей. Ставьте себе более амбициозную визуальную планку."],["Добавьте красный.","Используйте его точечно: обувь, оправу, сумку, помаду, трикотаж или небольшую деталь. Красный концентрирует внимание, добавляет образу энергии и силы. Если вас повысили, вашему мнению уже доверяют. Разрешите себе обозначать его визуально."],["Присвойте себе новую роль.","Не спрашивайте себя, достойны ли вы новой должности. Решение уже принято. Вас повысили, потому что увидели способность справляться с большим. Не ждите, пока почувствуете себя полностью готовой. Меняйте гардероб, привычки и требования к себе постепенно, но относитесь к себе с позиции новой роли уже сейчас.",1]],"Офис|Вызвать доверие|w":[["Считайте ДНК среды.","Если в офисе есть дресс-код, найдите один характерный для него элемент и интерпретируйте его в своём стиле. Если дресс-кода нет, опирайтесь на собственную визуальную идентичность — аутентичность делает человека более понятным и убедительным."],["Учитывайте степень прилегания.","Оставляйте пространство между телом и одеждой. Свобода посадки даёт свободу движения, а пластика тела становится спокойнее и естественнее."],["Уделите внимание портретной зоне.","Посмотрите на себя в кадрировании до груди. Волосы, оправа, украшения и линия горловины формируют первое впечатление ещё до того, как собеседник успевает рассмотреть образ целиком."],["Выстройте порядок восприятия.","Посмотрите на себя несколько секунд и отметьте, куда первым направляется взгляд. Для доверия сильная последовательность — лицо, затем образ целиком, затем детали. Такая визуальная ясность облегчает первое считывание человека."],["Учитывайте тактильность образа.","Добавьте фактуру, которая визуально ассоциируется с приятным прикосновением: кашемир, трикотаж, замшу, мягкую кожу, пластичную ткань. Тактильные ассоциации способны психологически сокращать дистанцию."],["Найдите свой узнаваемый маркер.","Выберите одну характерную деталь и периодически повторяйте её: оправу, часы, серьги, кольцо, брошь. Повторяемость формирует узнаваемость, а знакомое быстрее вызывает ощущение предсказуемости."],["Удерживайте зрительный контакт.","Во время знакомства или разговора задерживайте взгляд чуть дольше привычного. Прямой спокойный взгляд усиливает ощущение открытости и внимания. Если собеседник первым отводит глаза, сократите продолжительность контакта — комфорт другого человека также влияет на доверие.",1]],"Офис|Убедить|w":[["Соберите внимание ближе к лицу.","Оправа, серьги, воротник, лацканы, линия горловины работают как обрамление. Во время разговора взгляд собеседника должен возвращаться к вашему лицу."],["Выберите один элемент, который удерживает внимание.","Оправа, украшение, жакет, обувь, принт — акцент может быть любым. Важно, чтобы в образе была понятная визуальная иерархия."],["Уберите визуальную многословность.","Большое количество слоёв, деталей, декора и пересекающихся линий усложняет образ. Когда задача — убедить, визуальная ясность работает в вашу пользу."],["Не путайте убедительность с формальностью.","Костюм сам по себе не делает позицию весомее. Степень формальности выбирайте относительно среды и людей, с которыми предстоит разговор."],["Не демонстрируйте власть, если вам нужно согласие.","Слишком жёсткий образ способен перевести разговор из убеждения в противостояние. Оставьте собеседнику пространство согласиться с вами.",1],["Оставьте свободу жестам.","Руки участвуют в аргументации. Одежда не должна ограничивать движения, заставлять держать корпус неподвижно или постоянно себя контролировать."],["Учитывайте, кого именно вы убеждаете.","Собственник бизнеса, клиент, команда и совет директоров — разные аудитории. Один и тот же образ не может одинаково точно работать во всех четырёх ситуациях."],["Не отказывайтесь от индивидуальности.","Характерная оправа, украшение, необычная обувь или собственная манера сочетать вещи могут усиливать убедительность, если выглядят естественной частью вас."],["Если вы думаете «не слишком ли это?» — скорее всего, слишком.","Важный разговор — не лучшее место для вещи, которую вам самой приходится внутренне оправдывать."],["Не доказывайте равенство с мужчинами мужским гардеробом.","Жёсткое плечо, широкий лацкан и костюм не являются обязательными атрибутами авторитета. Убедительность женщины может строиться на точности силуэта, качестве материала, масштабе деталей, посадке и ясной визуальной позиции — без имитации мужских кодов власти."]],"Офис|Показать компетентность|w":[["Покажите тренд в одежде.","Это может быть современный девайс, например WHOOP, актуальная оправа, украшение, обувь или логотип на футболке или джинсах."],["Покажите, что ваши знания о стиле тоже развиваются.","Обновляйте силуэты, пропорции и способы сочетания вещей вместе с изменениями времени."],["Не усложняйте образ.","Сегодня актуальна лёгкость восприятия. Не пытайтесь одновременно показать тренды, статус, креативность и индивидуальность."],["Интерпретируйте тренд под себя.","Соедините актуальную вещь со своим привычным гардеробом и требованиями профессии. Способность не просто увидеть новое, а адаптировать его под задачу показывает креативность."],["Сохраняйте профессиональное любопытство.","Компетентность и креатив почти синонимы, переносите это на одежду.",1]],"Офис|Показать статус|w":[["Выберите одну вещь высокого уровня.","Это может быть сумка, часы, украшение, обувь или оправа. Один предмет с очевидным качеством или узнаваемым происхождением способен задать уровень всему образу."],["Делайте ставку на качество, которое видно вблизи.","Обратите внимание на материал, фурнитуру, обработку края и конструкцию вещи. В офисе статус часто считывается с близкой дистанции — через качество исполнения."],["Используйте узнаваемые коды адресно.","Логотип, культовая модель, винтаж или знаковое украшение особенно точно работают в среде, которая понимает их значение. Чем выше визуальная грамотность аудитории, тем больше информации способен передать один предмет."],["Позволяйте себе собственную интерпретацию офисного кода.","Знание правил даёт свободу обращаться с ними индивидуально. Необычная пропорция, дизайнерская вещь, винтаж или редкий аксессуар могут считываться как уверенность в собственном положении."],["Проверяйте подлинность статусных маркеров.","Если вещь должна сообщать о статусе через имя бренда, её подлинность становится частью этого сообщения. В среде, знакомой с оригиналом, качество кожи, фурнитуры, пропорции и детали исполнения считываются особенно быстро. Оригинальная вещь менее известного бренда или качественный винтаж дадут более убедительный сигнал, чем реплика известной модели."],["Следите за телом.","Чуть более размеренный темп движения, спокойное обращение с вещами и отсутствие суеты создают ощущение контроля и уверенности над ситуацией. Статус часто считывается через то, насколько естественно человек себя ведёт.",1]],"Офис|Обозначить амбицию|w":[["Поднимите визуальную планку.","Улучшите одну категорию гардероба: обувь, верхнюю одежду, оправу, часы или сумку. Не оставляйте то, что уже выглядит «просто нормально»."],["Осваивайте сложные вещи.","Добавьте непривычный крой, новую пропорцию или более выразительный аксессуар. Это показывает готовность выходить за рамки привычного."],["Позвольте себе выделяться.","Оставьте один заметный элемент: оправу, украшение, обувь или необычную конструкцию вещи. Амбиция не требует визуально растворяться среди других."],["Показывайте интерес к новому.","Используйте актуальную форму или новый способ стилизации. Ваш внешний язык не должен оставаться неизменным годами."],["Не держитесь за прежний образ.","Меняются задачи и масштаб — пересматривайте гардероб. Внешний вид должен меняться вместе с вами."],["Разрешите себе хотеть большего.","Не уменьшайте свои цели, чтобы они казались окружающим удобнее или реалистичнее. Говорите о том, чего хотите достичь, без самоиронии, оправданий и обесценивания. Самый сильный сигнал амбиции — вы сами считаете своё большое желание нормальным.",1]],"Офис|Показать открытость новому|w":[["Выбирайте актуальную версию привычных вещей.","Современный крой жакета, брюк, рубашки или пальто показывает, что ваш визуальный язык меняется вместе со временем."],["Обновляйте детали, а не весь гардероб.","Гардероб может оставаться привычным, но очки, украшения, сумка или обувь должны быть актуальными. Это меньшая статья расходов, но именно детали часто первыми цепляют взгляд и показывают, что вы в тренде."],["Откажитесь от устаревших правил сочетания.","Костюм сегодня не требует классической обуви, а вечерняя вещь — вечернего повода: современный стайлинг показывает современный способ мышления."],["Сделайте технологии привычной частью образа.","Новые гаджеты и технологичные аксессуары используйте естественно — как рабочий инструмент, а не как сложную новинку, которую приходится специально осваивать."],["Пробуйте новые материалы и конструкции.","Технологичная ткань, необычная конструкция или новая функциональная деталь показывают интерес к тому, как меняются одежда и дизайн."],["Говорите через действие.","Не рассуждайте о том, насколько новое сложно. «Давайте попробуем», «давайте сделаем», «посмотрим, как это работает» показывают готовность осваивать новое.",1]],"Офис|Вызвать доверие|m":[["Развивайте харизму.","Харизму можно развивать. Важно, чтобы ваше внутреннее состояние соответствовало тому, как вы выглядите, говорите и ведёте себя.\nНе пытайтесь казаться увереннее, чем вы есть.\nВоспользуйтесь тестом на харизму от французского института лидеров: https://www.idrlabs.com/charisma/test.php"],["Не путайте субординацию с дистанцией.","Представьте двух официантов.\nОдин безупречно перечисляет блюда по инструкции. Другой искренне рекомендует то, что сам считает интересным, и объясняет почему.\nКому вы скорее доверитесь?\nВ офисе действует похожий принцип. Соблюдайте профессиональные границы, но не превращайте общение в набор заученных фраз."],["Проявляйте искренний интерес к людям.","Имейте собственное мнение, но уважайте чужую точку зрения.\nЛюди охотнее идут на контакт, когда чувствуют, что их мнение важно."],["Обращайте внимание на внешний вид.","Доверие не требует строгого костюма или дорогих часов.\nВажнее понимать, что вам идёт, соблюдать пропорции и следить за состоянием одежды.\nПравильная длина брюк, хорошая посадка рубашки, ухоженная обувь. Такие детали создают впечатление собранности и внимания к себе.\nПусть ваш повседневный образ будет простым, но аккуратным.\nЕсли вы носите джинсы, следите за их посадкой, длиной и состоянием. Пусть у вас их будет несколько.\nИзлишние складки у обуви могут сделать даже хороший образ небрежным. Если это классические джинсы, должно быть не более одного залома.\nКомфортно и небрежно не одно и то же.\nПосмотрите на себя со стороны. Вам нравится то, что вы видите? Понравиться себе естественное желание."],["Обратите внимание на взгляд, движения и темп речи.","Умеете ли вы слушать, не перебивая? Спокойно реагировать на возражения? Признавать, что чего-то не знаете?\nУверенность не требует постоянного доказательства собственной правоты.\nПредставьте двух коллег. Один всегда стремится показать, что знает больше остальных. Другой спокойно аргументирует свою позицию, задаёт вопросы и готов признать чужую правоту.\nС кем вы предпочтёте работать над важным проектом?\nЛюди доверяют не идеальным людям. Люди доверяют тем, рядом с кем могут оставаться собой.",1],["Помните: доверие это не только отношение к вам.","Это ваши будущие возможности."]],"Офис|Показать компетентность|m":[["Демонстрируйте понимание современного контекста, другими словами тренды.","Необязательно следовать трендам. Важно понимать изменения и выбирать то, что подходит вам.\nВаш рост это ещё и изменения в одежде."],["Выбирайте одежду с учётом профессиональной среды и задачи, но добавляйте экспромта.","Приподнимайте ворот пиджака, подворачивайте манжету, откажитесь от рубашек с коротким рукавом."],["Современный пиджак с джинсами, качественный трикотаж, интересная оправа имиджевых очков, винтажный портфель вместо рюкзака.",""],["Носки либо в цвет обуви, либо яркие.",""],["Профессиональный опыт ценен, пока вы продолжаете его обновлять.","Интересуйтесь новыми технологиями, изучайте подходы коллег и будьте готовы пересмотреть собственное мнение."],["Компетентный человек отличается количеством вопросов.","Обычно в умении слушать ответы рождается уникальное компетентное решение."],["Позволяйте себе не знать.","Эксперт, который говорит: «Сейчас у меня недостаточно информации. Я уточню и предложу решение», зачастую убедительнее человека, у которого есть ответ на всё.\nКомпетентность не требует постоянного доказательства правоты."],["Умейте слушать и выдерживать паузу.","Рекомендации Системы имиджа созданы, чтобы довести уверенность до автоматизма.\nНе пытайтесь контролировать каждый жест. Спокойная реакция помогает окружающим видеть в вас человека, способного решать сложные задачи.",1],["Помните: компетентность это не знать всё, а уметь разобраться.","Одежда формирует первое впечатление. Ваши знания, решения и действия определяют профессиональную репутацию."]],"Офис|Показать статус|m":[["Статус это качество выбора, а не стоимость покупки.","Выбирая качественные вещи, даже малоизвестных брендов, вы демонстрируете уважение к себе и собственным стандартам."],["Исследования показывают: формальная одежда повышает вероятность того, что человека воспринимают как лидера.","Костюм может формировать впечатление:\n• компетентности;\n• авторитета;\n• профессионализма;\n• дисциплины;\n• принадлежности к деловой среде.\nВ консервативной среде выбирайте классический костюм. В креативной допускайте индивидуальность через силуэт, фактуру и аксессуары."],["Выбирайте цвет костюма.","Тёмно-синий: надёжность, компетентность, авторитет. Универсальный цвет делового костюма. Подходит для переговоров, руководящих должностей и официальных встреч.\nГрафитовый: серьёзность, дисциплина, формальность. Подходит для ситуаций, в которых необходимо подчеркнуть профессиональную дистанцию и авторитет.\nСредне-серый: компетентность, сдержанность, открытость. Менее формален, чем графитовый. Подходит для повседневной деловой среды.\nТёмно-коричневый: индивидуальность, традиция, уверенность. Демонстрирует понимание классического мужского стиля. Подходит для менее формальных деловых встреч.\nОливковый и тёмно-зелёный: самостоятельность, вкус, индивидуальность. Уместны в творческой и менее консервативной профессиональной среде.\nЧёрный: формальность."],["Носки подбирают в тон брюк.","Это классическое правило. Цветные носки инструмент индивидуальности.\nДля деловой среды выбирайте сложные, приглушённые оттенки: бордовый, тёмно-зелёный, сливовый."],["Статус не требует демонстрации превосходства.","Уважение формируется через компетентность и качество взаимодействия.\nВсегда помните об этикете: соблюдение договорённостей.",1]],"Переговоры|Вызвать доверие|w":[["Приходите вовремя.","Пунктуальность показывает уважение к договорённостям и формирует доверие ещё до начала разговора."],["Выбирайте нейтральную одежду.","Белая или голубая рубашка, простой жакет, спокойный трикотаж не отвлекают внимание и позволяют сосредоточиться на разговоре и вашей личности."],["Оставьте одну личную деталь.","Часы, кольцо, украшение или оправа очков могут говорить о вашем вкусе и увлечениях. Это сохраняет индивидуальность и создаёт естественную точку для первого контакта."],["Смотрите в глаза.","Поддерживайте прямой контакт глазами, особенно когда слушаете. Это показывает внимание к человеку и помогает быстрее установить доверительную связь."],["Узнайте о человеке до встречи.","Заранее выясните, чем он интересуется и что для него важно. Начните беседу с близкой ему темы: это помогает расположить человека и создать личный контакт до перехода к предмету переговоров.",1]],"Презентация, питч|*|w":[["Тело и жесты.","Когда человек выступает либо на конференции, либо на презентации, либо проводит какую-то встречу, я считаю, что важно в этом тело и не стоит придерживаться правил, что нельзя жестикулировать. Жесты это как раз эмоциональная составляющая. Если человек не создает движение руками, это, наоборот, выглядит странно."],["Пространство и масштаб.","Очень важно понимать, в каком пространстве идет выступление, чтобы быть центральной фигурой, чтобы всё внимание было на вас. Очень важно понимать размер зала. Поэтому ничего сложного не нужно надевать. Это должна быть коммуникация с людьми абсолютно разного уровня, перед которыми идет выступление. Соблюдайте дресс-код."],["Комфорт.","Вы не должны отвлекать на одежду."],["Губы и деталь возле лица.","И самое важное, это всё-таки губы. Внимание на губы и обязательно точно какую-то деталь возле лица, потому что люди делают фотографии, чаще всего фотографии спикера. И возле лица должно быть либо украшение, либо цвет. Вот здесь лучше воспользоваться инструментом определения контрастности."],["Выбрать глазами одного человека в зале и представить, что вы ему рассказываете.","",1]],"Публичное выступление, конференция, networking|*|w":[["Тело и жесты.","Когда человек выступает либо на конференции, либо на презентации, либо проводит какую-то встречу, я считаю, что важно в этом тело и не стоит придерживаться правил, что нельзя жестикулировать. Жесты это как раз эмоциональная составляющая. Если человек не создает движение руками, это, наоборот, выглядит странно."],["Пространство и масштаб.","Очень важно понимать, в каком пространстве идет выступление, чтобы быть центральной фигурой, чтобы всё внимание было на вас. Очень важно понимать размер зала. Поэтому ничего сложного не нужно надевать. Это должна быть коммуникация с людьми абсолютно разного уровня, перед которыми идет выступление. Соблюдайте дресс-код."],["Комфорт.","Вы не должны отвлекать на одежду."],["Губы и деталь возле лица.","И самое важное, это всё-таки губы. Внимание на губы и обязательно точно какую-то деталь возле лица, потому что люди делают фотографии, чаще всего фотографии спикера. И возле лица должно быть либо украшение, либо цвет. Вот здесь лучше воспользоваться инструментом определения контрастности."],["Выбрать глазами одного человека в зале и представить, что вы ему рассказываете.","",1]],"Собеседование|*|w":[["Не одевайтесь по старым правилам.","Обязательный костюм, нейтральность и строгая деловая формула больше не универсальны. Оставайтесь собой, учитывая уровень позиции и среду компании. Потратьте время на подготовку."],["Не усложняйте первое впечатление.","Сложная стилизация и большое количество деталей требуют дополнительного внимания. Ограничьтесь тремя оттенками. Помните: где расположен акцент, там будет и внимание собеседника."],["Изучите культурный код компании.","Посмотрите, как сотрудники и руководители выглядят на встречах, конференциях и мероприятиях. Определите реальную степень формальности и свободы. Даже если все носят футболки и джинсы, сохраняйте свою индивидуальность."],["Работайте с портретной зоной.","Лицо, волосы, оправа, серьги, горловина и лацканы находятся в поле зрения собеседника большую часть встречи. Проверьте масштаб деталей относительно лица — ничто не должно забирать внимание у вас."],["Не демонстрируйте статус.","Опрятность, состояние обуви, волос, одежды и деталей важнее стоимости вещей. Не старайтесь удивить с первого касания. Профессиональный уровень лучше раскрывать голосом, содержанием разговора, юмором и способом мышления."],["Оставьте одну запоминающуюся деталь.","Оправа, украшение или часы могут стать визуальным якорем. Без заметных логотипов: запомнить должны вас, а не бренд."],["Обратите внимание на то, как вы входите.","Темп движения, положение корпуса и пластика сразу передают состояние тела — спокойствие, напряжение, тревогу. Не изображайте уверенность. Войдите, увидьте человека и установите контакт."],["Используйте взгляд для разговора.","Смотрите на человека, когда слушаете. Во время размышления взгляд может естественно уходить. Заканчивая важную мысль, возвращайте его к собеседнику."],["Замечайте повторяющиеся жесты тревоги.","Постоянно поправлять волосы, трогать лицо, одежду или украшения — значит невольно показывать волнение. Жестикуляцию контролировать не нужно: естественные движения рук нормальны."],["Не скрывайте волнение.","Волноваться на собеседовании нормально. Если это мешает, спокойно скажите: «Я немного волнуюсь». Это снимает необходимость маскировать своё состояние."],["Не контролируйте тело.","Не думайте, куда положить руки, как поставить ноги и насколько прямо сидеть. Контроль позы забирает внимание у главного — разговора и эмоционального контакта."],["Используйте паузу.","На сложный вопрос не отвечайте мгновенно. Несколько секунд на формулировку мысли показывают способность думать, а не необходимость заполнить тишину."],["Используйте юмор.","Если юмор вам свойственен, не убирайте его из профессионального разговора. Он снимает лишнюю формальность. Не готовьте шутки заранее — реагируйте на ситуацию."],["Не маскируйте незнание.","Не знаете точного ответа — скажите об этом и объясните, как получите информацию. «Я уточню» профессиональнее попытки импровизировать там, где нет знания."],["Помните масштаб своей работы.","Перед встречей восстановите цифры: размер команды, бюджет, сроки, количество проектов, рост, выручку и другие показатели вашей ответственности."],["Слушайте, как собеседник говорит о других.","Обратите внимание, как потенциальный руководитель говорит о коллегах, команде, предыдущем сотруднике и компании. Это один из способов понять рабочую культуру."]]};/*/RULES*/

function pzShow(r, R, img){

      '<dt>' + t('Масштаб черт', 'Scale of features') + '</dt><dd>' + pack.LABELS.scale[r.scale] + '</dd><dt>' + t('Геометрия', 'Geometry') + '</dt><dd>' + pack.LABELS.geom[r.geom] + '</dd><dt>' + t('Пропорция', 'Proportion') + '</dt><dd>' + pack.LABELS.shape[r.shape] + '</dd></dl></div>' +
    pack.ZONE.map(function(z, i){ var a = z[r.scale] || z[r.shape] || ''; return '<div class="pz-card"><span class="n">' + nn(i + 1) + '</span><div><b>' + esc(z.t) + '</b><p>' + esc(a + (a ? ' ' : '') + (z[r.geom] || '')) + '</p></div></div>'; }).join('') +
    '<p class="pz-draft">' + t('Черновик · правила уточняются', 'Draft. The rules are still being set.') + '</p>' +
    '<button class="rz-all" data-go="2">' + t('К образам Zoom →', 'To the Zoom looks →') + '</button>';
  // Превью: лицо из фото, кадр 4:5 с запасом вокруг
  var c = document.getElementById('pzFace'), x = c.getContext('2d'), W = img.naturalWidth, H = img.naturalHeight, b = r.box;
  var bh = b.h * H * 1.5, bw = bh * 0.8, cx = (b.x + b.w / 2) * W, cy = (b.y + b.h / 2) * H;
  x.drawImage(img, cx - bw / 2, cy - bh / 2, bw, bh, 0, 0, 192, 240);

}

function onTap(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) { setLang(b.dataset.lang); return; }
  if (b.dataset.rznext) { var j = +b.dataset.rznext; rzSet(j); var li = document.getElementById('rzL').children[j]; setTimeout(function(){ li.scrollIntoView({behavior: 'smooth', block: 'center'}); }, 80); return; }
  if (b.dataset.rz) { rzSet(+b.dataset.rz); return; }
  if (b.dataset.voice) { voice(b, e); return; }
  if (b.dataset.bav) { bavSet(+b.dataset.bav); if (b.dataset.up) document.getElementById('bav').scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  if (b.dataset.bapt) { var li = document.getElementById('rl' + b.dataset.bapt); li.scrollIntoView({behavior: 'smooth', block: 'center'}); li.classList.add('open'); li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash'); return; }
  if (b.dataset.sys) { location.href = '/guide'; return; }
  if (b.dataset.sex) {
    if (!canSex(b.dataset.sex)) return;
    st.sex = b.dataset.sex; try { localStorage.setItem('img_sex', st.sex); } catch(e){}
    if (b.dataset.next === 'letter') return go('letter', {});
    if (b.dataset.next) return go('s1', {});
    // у мужчин пока готов не каждый сценарий: возвращаемся к выбору события
    if (st.sit && st.sex === 'm' && !menReady(st.sit)) { document.body.classList.remove('menu-on'); return go('s1', {sit: null, goal: null}); }
    if (st.sit && st.goal && goalsFor(st.sit).indexOf(st.goal) < 0) { st.goal = null; if (/^(s3|s4)$/.test(st.view)) { document.body.classList.remove('menu-on'); return go('s2', {}); } }
    if (document.body.classList.contains('menu-on')) openMenu(); draw(); return; }
  if (b.dataset.tab) return go('s1', {env: +b.dataset.tab});
  // 03.11: одна цель у события: шаг выбора пропускаем, блок раскрывается сразу
  if (b.dataset.sit) { var og = goalsFor(b.dataset.sit); return og.length === 1 ? go('s3', {sit: b.dataset.sit, env: +b.dataset.env, goal: og[0]}) : go('s2', {sit: b.dataset.sit, env: +b.dataset.env, goal: b.dataset.sit === st.sit ? st.goal : null}); }
  if (b.dataset.goal) return go('s3', {goal: b.dataset.goal});
  if (b.dataset.tabx) { st.tab = +b.dataset.tabx; var y = window.scrollY; draw(); window.scrollTo(0, y); return; }
  if (b.dataset.go === 'cover') return go('cover', {});
  if (b.dataset.go === 'about') return go('about', {});
  if (b.dataset.go === 'intro') return go('intro', {});
  if (b.dataset.go === 'tariffs') return go('tariffs', {});
  if (b.dataset.go === '1') return go(st.view === 'cover' || st.view === 'intro' || !st.sex ? 's0' : 's1', {});
  if (b.dataset.go === '2') { if (!st.sit) return go('s1', {}); var og2 = goalsFor(st.sit); if (og2.length === 1) return st.view === 's1' ? go('s3', {goal: og2[0]}) : go('s1', {}); return go('s2', {}); }
  if (b.dataset.go === '3') return go(st.goal ? 's3' : 's2', {});
  if (b.dataset.go === '4') return go('s4', {tab: 0});
  if (b.dataset.go === 'portrait') return go('portrait', {});
  if (b.dataset.go === 'books') return go('books', {});
  if (b.dataset.go === 'videos') return go('videos', {});
  if (b.dataset.go === 'install') return go('install', {});
}
