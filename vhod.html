<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111111">
<title>Вход · Система имиджа</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{background:#111;color:#F4F2EE}
body{font-family:Jost,-apple-system,sans-serif;font-weight:300;font-size:17px;line-height:1.45;min-height:100svh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:440px;margin:0 auto;padding:12vh 26px 40px}
h1{font:400 56px/.92 Oswald,sans-serif;text-transform:uppercase;margin-bottom:22px}h1 i{font-style:normal;font-weight:300;color:#C9A96A}
p{color:rgba(244,242,238,.75)}
input{display:block;width:100%;margin:20px 0 12px;padding:15px;background:none;border:1px solid rgba(244,242,238,.35);color:#F4F2EE;font:300 18px Jost,sans-serif;border-radius:0}
input:focus{outline:0;border-color:#C9A96A}#code{letter-spacing:.4em;text-align:center;font-size:24px}
button{display:block;width:100%;padding:17px;background:#C9A96A;color:#111;border:0;font:400 13px/1 Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.5}
.link{background:none;color:rgba(244,242,238,.7);margin-top:14px;letter-spacing:.06em;text-transform:none;font:300 15px Jost,sans-serif;text-decoration:underline}
#msg{min-height:24px;margin-top:14px;color:#FF7A6B;font-size:15px}[hidden]{display:none!important}
footer{padding:18px 16px 24px;text-align:center;font-size:11.5px;line-height:1.7;color:#8B8983}footer a{color:inherit}
</style></head><body>
<main>
  <h1>Система<br><i>имиджа</i></h1>
  <form id="f1"><p>Введите почту, которую указали при оплате. На неё придёт код.</p><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="Почта" required aria-label="Почта"><button>Получить код</button></form>
  <form id="f2" hidden><p id="sent"></p><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" required aria-label="Код из письма"><button>Войти</button><button type="button" class="link" id="back">Другая почта или новый код</button></form>
  <div id="msg" role="alert"></div>
  <p style="margin-top:22px;font-size:15px">Ещё нет доступа? <a href="/image" style="color:#C9A96A">Открыть Систему имиджа</a></p>
</main>
<footer><a href="/oferta">Договор оферты</a> · <a href="/privacy">Политика конфиденциальности</a> · <a href="https://t.me/MilaUshakova_ClubBot?start=support">Поддержка</a><br>© 2026 · ИП Ольхина Я.Ф., ИНН 222411003828, ОГРНИП 326220200112474</footer>
<script>
if(/tariff/.test(location.hash))location.replace('/tariffs');
var $=function(i){return document.getElementById(i)},NEXT='/sistem-image';
if(/other=1/.test(location.search))document.addEventListener('DOMContentLoaded',function(){$('msg').textContent='Вы вошли на другом устройстве. Доступ работает на одном устройстве: чтобы продолжить здесь, войдите снова.'});
if(/expired=1/.test(location.search))document.addEventListener('DOMContentLoaded',function(){$('msg').textContent='Срок доступа закончился. Продлить можно на странице оплаты.'});
fetch('/api/access?do=me').then(function(r){return r.json()}).then(function(m){if(m.signedIn&&m.active)location.replace(NEXT)}).catch(function(){});
function post(a,b){return fetch('/api/access?do='+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){j.status=r.status;return j})})}
function say(t){$('msg').textContent=t||''}
function fail(){say('Сейчас не получилось. Попробуйте ещё раз или напишите в поддержку.')}
$('f1').onsubmit=function(e){e.preventDefault();say('');var b=this.querySelector('button');b.disabled=true;post('code',{email:$('email').value}).then(function(r){b.disabled=false;if(!r.ok)return say(r.error==='bad-email'?'Проверьте почту.':'Сейчас не получилось. Попробуйте ещё раз.');$('sent').textContent='Если на '+$('email').value.trim()+' есть оплата, мы отправили код. Проверьте и папку «Спам».';$('f1').hidden=true;$('f2').hidden=false;$('code').focus()}).catch(function(){b.disabled=false;fail()})};
$('f2').onsubmit=function(e){e.preventDefault();say('');var b=this.querySelector('button');b.disabled=true;post('verify',{email:$('email').value,code:$('code').value}).then(function(r){b.disabled=false;if(r.ok)return location.replace(NEXT);$('code').value='';say(r.error==='wrong'&&r.left>0?'Код не подошёл. Осталось попыток: '+r.left+'.':'Код больше не действует. Запросите новый.')}).catch(function(){b.disabled=false;fail()})};
$('back').onclick=function(){say('');$('f2').hidden=true;$('f1').hidden=false};
</script></body></html>
